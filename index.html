  return <div style={{display:'flex',flexDirection:'column',gap:14}}>
    <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
      <StatCard label="Tarifas activas" value={active} icon="✅" color="#5CBB00"/>
      {byCountry.map(c=><StatCard key={c.country} label={c.country} value={c.count} icon="📌" color="#3B82F6"/>)}
      {expiring>0&&<StatCard label="Vigencia vencida" value={expiring} icon="⚠️" color="#EF4444"/>}
    </div>

    <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
      <input placeholder="🔍 Buscar cliente..." value={filter} onChange={e=>setFilter(e.target.value)} style={{flex:1,minWidth:180,background:'#141820',border:'1px solid #1E2535',color:'#E2E8F0',borderRadius:8,padding:'8px 12px',fontSize:13,outline:'none'}}/>
      <select value={countryFilter} onChange={e=>setCountryFilterVal(e.target.value)} style={{background:'#141820',border:'1px solid #1E2535',color:'#E2E8F0',borderRadius:8,padding:'8px 12px',fontSize:13,cursor:'pointer',outline:'none'}}>
        <option value="Todos">Todos los países</option>
        {Object.keys(BASE_TARIFFS).map(c=><option key={c} value={c}>{c}</option>)}
      </select>
      <select value={serviceFilter} onChange={e=>setServiceFilter(e.target.value)} style={{background:'#141820',border:'1px solid #1E2535',color:'#E2E8F0',borderRadius:8,padding:'8px 12px',fontSize:13,cursor:'pointer',outline:'none'}}>
        <option value="Todos">Todos los servicios</option>
        {SERVICES.map(s=><option key={s} value={s}>{s}</option>)}
      </select>
      <button onClick={()=>exportToCSV(filtered,'tarifas-clientes.csv')} style={{padding:'8px 14px',borderRadius:8,border:'1px solid #2D3748',background:'transparent',color:'#64748B',fontSize:12,cursor:'pointer'}}>↓ Exportar CSV</button>
    </div>

    {Object.keys(BASE_TARIFFS).map(country=>{
      const countryTariffs=filtered.filter(t=>t.country===country)
      if(!countryTariffs.length)return null
      return <div key={country}>
        <div style={{fontSize:11,fontWeight:600,color:'#5CBB00',textTransform:'uppercase',letterSpacing:1,marginBottom:8,paddingLeft:4}}>{country}</div>
        <Card style={{padding:0,overflow:'hidden',marginBottom:4}}>
          <table style={{width:'100%',borderCollapse:'collapse',tableLayout:'fixed'}}>
            <thead><tr style={{borderBottom:'1px solid #1E2535'}}>
              {[['Cliente',22],['Zona',12],['Servicio',11],['Tarifa base',11],['Descuento',9],['Tarifa negociada',13],['COD',6],['Volumen',9],['Vigencia',11],['Estado',8],['',8]].map(([h,w])=>(
                <th key={h} style={{padding:'9px 10px',fontSize:10,color:'#64748B',textTransform:'uppercase',textAlign:'left',background:'#0F1117',width:`${w}%`}}>{h}</th>
              ))}
            </tr></thead>
            <tbody>
              {countryTariffs.map(t=>{
                const isExpired=t.vigencia_hasta&&t.vigencia_hasta<today
                const disc=parseFloat(t.descuento_pct)||0
                return <tr key={t.id} style={{borderBottom:'1px solid #1E253540',background:isExpired?'#EF444408':'transparent'}}>
                  <td style={{padding:'9px 10px',fontSize:13,fontWeight:600,color:'#F1F5F9',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{t.cliente}</td>
                  <td style={{padding:'9px 10px',fontSize:11,color:'#94A3B8'}}>{t.zona||'—'}</td>
                  <td style={{padding:'9px 10px'}}><Badge text={t.servicio||'—'} color="#8B5CF6"/></td>
                  <td style={{padding:'9px 10px',fontSize:11,color:'#64748B'}}>{t.tarifa_usd?`USD ${parseFloat(t.tarifa_usd).toFixed(2)}`:'—'}</td>
                  <td style={{padding:'9px 10px'}}><Badge text={`${disc.toFixed(1)}%`} color={disc>15?'#EF4444':disc>0?'#F59E0B':'#5CBB00'}/></td>
                  <td style={{padding:'9px 10px',fontSize:12,fontWeight:700,color:disc>15?'#EF4444':disc>0?'#F59E0B':'#5CBB00'}}>{t.tarifa_negociada?`USD ${parseFloat(t.tarifa_negociada).toFixed(2)}`:'—'}</td>
                  <td style={{padding:'9px 10px',fontSize:12}}>{t.cod?'✅':'—'}</td>
                  <td style={{padding:'9px 10px',fontSize:11,color:'#007B84'}}>{t.volumen_est?fmtNum(t.volumen_est):'—'}</td>
                  <td style={{padding:'9px 10px',fontSize:10,color:isExpired?'#EF4444':'#64748B'}}>{t.vigencia_hasta||'—'}{isExpired&&' ⚠'}</td>
                  <td style={{padding:'9px 10px'}}><Badge text={t.estado||'—'} color={t.estado==='Activa'?'#5CBB00':t.estado==='Vencida'?'#EF4444':'#F59E0B'}/></td>
                  <td style={{padding:'9px 10px'}}>
                    <div style={{display:'flex',gap:3}}>
                      <MiniBtn onClick={()=>onEdit(t)} color="#3B82F6">✎</MiniBtn>
                      {isRegional&&<MiniBtn onClick={()=>setConfirmDelete(t)} color="#64748B">🗑</MiniBtn>}
                    </div>
                  </td>
                </tr>
              })}
            </tbody>
          </table>
        </Card>
      </div>
    })}

    {filtered.length===0&&<EmptyState icon="🗂️" title="No hay tarifas registradas" sub="Creá la primera tarifa de cliente usando el botón + Nueva Tarifa"/>}

    {confirmDelete&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.8)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:2000}}>
      <div style={{background:'#141820',border:'1px solid #EF444444',borderRadius:16,padding:28,width:380,textAlign:'center'}}>
        <div style={{fontSize:32,marginBottom:12}}>🗑️</div>
        <div style={{fontSize:16,fontWeight:700,color:'#F1F5F9',marginBottom:8}}>¿Eliminar tarifa?</div>
        <div style={{fontSize:13,color:'#94A3B8',marginBottom:22}}>Tarifa de <strong style={{color:'#EF4444'}}>{confirmDelete.cliente}</strong> — {confirmDelete.country} / {confirmDelete.servicio}</div>
        <div style={{display:'flex',gap:10,justifyContent:'center'}}>
          <button onClick={()=>setConfirmDelete(null)} style={{background:'#1E2535',border:'1px solid #2D3748',color:'#94A3B8',borderRadius:8,padding:'9px 20px',fontSize:13,cursor:'pointer'}}>Cancelar</button>
          <button onClick={()=>{onDelete(confirmDelete);setConfirmDelete(null)}} style={{background:'#EF4444',color:'white',border:'none',borderRadius:8,padding:'9px 20px',fontSize:13,fontWeight:600,cursor:'pointer'}}>Eliminar</button>
        </div>
      </div>
    </div>}
  </div>
}


  {id:'pipeline',icon:'🔀',label:'Pipeline'},
  {id:'leads',icon:'🎯',label:'Leads'},
  {id:'prospects',icon:'🔍',label:'Prospectos'},
  {id:'accounts',icon:'🏢',label:'Cuentas'},
  {id:'activities',icon:'📋',label:'Actividades'},
  {id:'pricing',icon:'💲',label:'Aprobaciones Pricing'},
  {id:'client_tariffs',icon:'🗂️',label:'Tarifas de Clientes'},
  {id:'products',icon:'📦',label:'Productos & Tarifas'},
  {id:'reports',icon:'📈',label:'Reportes'}
]

function CRMApp(){
  const{profile,signOut,isRegional,userCountry}=useAuth()
  const[view,setView]=useState('dashboard')
  const[selectedCountry,setSelectedCountry]=useState('LATAM')
  const[leads,setLeads]=useState([])
  const[prospects,setProspects]=useState([])
  const[accounts,setAccounts]=useState([])
  const[activities,setActivities]=useState([])
  const[products,setProducts]=useState([])
  const[clientTariffs,setClientTariffs]=useState([])
  const[editClientTariff,setEditClientTariff]=useState(null)
  const[showClientTariffModal,setShowClientTariffModal]=useState(false)
  const[loading,setLoading]=useState(true)
  const[error,setError]=useState(null)
  const[showLeadModal,setShowLeadModal]=useState(false)
  const[showQuickLead,setShowQuickLead]=useState(false)
  const[detailLead,setDetailLead]=useState(null)
  const[editProspect,setEditProspect]=useState(null)
  const[showProspectModal,setShowProspectModal]=useState(false)
  const[bpmEntity,setBpmEntity]=useState(null)
  const[fichaAccount,setFichaAccount]=useState(null)
  const[activityLead,setActivityLead]=useState(null)
  const[editActivityData,setEditActivityData]=useState(null)
  const[lossLead,setLossLead]=useState(null)
  const[showImport,setShowImport]=useState(false)
  const[showImportProspects,setShowImportProspects]=useState(false)
  const[sidebarCollapsed,setSidebarCollapsed]=useState(false)
  const[toast,setToast]=useState(null)
  const[showDailyAlert,setShowDailyAlert]=useState(false)
  const[dailyAlertDismissed,setDailyAlertDismissed]=useState(false)
  const[pricingLead,setPricingLead]=useState(null)

  const showToast=(msg,type='success')=>{setToast({msg,type});setTimeout(()=>setToast(null),3500)}

  useEffect(()=>{
    if(!loading&&activities.length&&!dailyAlertDismissed){
      const today=new Date().toISOString().split('T')[0]
      const todayActs=activities.filter(a=>!a.realizada&&(a.fecha_vencimiento===today||a.fecha===today))
      if(todayActs.length>0)setShowDailyAlert(true)
    }
  },[loading,activities,dailyAlertDismissed])

  const effectiveCountry=isRegional?selectedCountry:userCountry
  const countryFilter=useCallback(items=>{
    if(effectiveCountry==='LATAM')return items
    if(effectiveCountry==='Regional')return items.filter(i=>i.country==='Regional')
    return items.filter(i=>i.country===effectiveCountry)
  },[effectiveCountry])

  const fetchAll=useCallback(async()=>{
    setLoading(true);setError(null)
    try{
      const country=isRegional?null:userCountry
      let lQ=sb.from('leads').select('*').order('created_at',{ascending:false})
      let pQ=sb.from('prospects').select('*').order('created_at',{ascending:false})
      let aQ=sb.from('accounts').select('*').order('created_at',{ascending:false})
      let prQ=sb.from('products').select('*').order('country')
      if(country){lQ=lQ.eq('country',country);pQ=pQ.eq('country',country);aQ=aQ.eq('country',country);prQ=prQ.eq('country',country)}
      const[l,p,a,act,prod,ct]=await Promise.all([lQ,pQ,aQ,sb.from('activities').select('*').order('fecha',{ascending:false}),prQ,sb.from('client_tariffs').select('*').order('created_at',{ascending:false})])
      if(l.error)throw l.error
      setLeads(l.data||[]);setProspects(p.data||[]);setAccounts(a.data||[]);setActivities(act.data||[]);setProducts(prod.data||[]);setClientTariffs(ct.data||[])
    }catch(e){setError('Error al cargar datos. Verificá tu conexión.')}
    setLoading(false)
  },[isRegional,userCountry])

  useEffect(()=>{fetchAll()},[fetchAll])

  async function deleteLead(lead){
    const{error}=await sb.from('leads').delete().eq('id',lead.id)
    if(!error){setLeads(prev=>prev.filter(l=>l.id!==lead.id));showToast(`${lead.empresa} eliminado`)}
    else showToast('Error al eliminar','error')
  }

  async function saveLead(data){
    const now=new Date().toISOString()
    if(data.id){
      const prev=leads.find(l=>l.id===data.id)
      let history=prev?.stage_history||[]
      if(prev&&prev.status!==data.status)history=[...history,{from:prev.status,to:data.status,at:now,by:profile?.email||'',loss_reason:data.loss_reason||null}]
      const{error}=await sb.from('leads').update({...data,stage_history:history}).eq('id',data.id)
      if(error){showToast('Error al guardar','error');return}
      setLeads(prev=>prev.map(l=>l.id===data.id?{...data,stage_history:history}:l))
      showToast('Lead actualizado ✅')
    }else{
      const{data:newLead,error}=await sb.from('leads').insert([{...data,created_at:now,created_by:profile?.id}]).select().single()
      if(error){showToast('Error al crear lead','error');return}
      setLeads(prev=>[newLead,...prev])
      showToast('Lead creado ✅')
    }
    setShowLeadModal(false);setShowQuickLead(false);setEditLead(null)
  }

  async function savePricingProposal(lead, pricingData) {
    const{error}=await sb.from('leads').update(pricingData).eq('id',lead.id)
    if(!error){
      setLeads(prev=>prev.map(l=>l.id===lead.id?{...l,...pricingData}:l))
      showToast('Propuesta guardada ✅')
    } else {
      showToast('Error al guardar propuesta','error')
    }
  }

  async function moveLead(lead,newStatus){
    const now=new Date().toISOString()
    const history=[...(lead.stage_history||[]),{from:lead.status,to:newStatus,at:now,by:profile?.email||''}]
    const{error}=await sb.from('leads').update({status:newStatus,stage_history:history,progress_to_won:newStatus==='Ganado'?100:newStatus==='Perdido'?0:lead.progress_to_won}).eq('id',lead.id)
    if(!error){setLeads(prev=>prev.map(l=>l.id===lead.id?{...l,status:newStatus,stage_history:history}:l));showToast(`${lead.empresa} → ${newStatus}`)}
  }

  async function confirmLoss(lead,reason){
    const now=new Date().toISOString()
    const history=[...(lead.stage_history||[]),{from:lead.status,to:'Perdido',at:now,by:profile?.email||'',loss_reason:reason}]
    const{error}=await sb.from('leads').update({status:'Perdido',loss_reason:reason,progress_to_won:0,stage_history:history}).eq('id',lead.id)
    if(!error){setLeads(prev=>prev.map(l=>l.id===lead.id?{...l,status:'Perdido',loss_reason:reason,stage_history:history}:l));showToast(`${lead.empresa} marcado como Perdido`)}
    setLossLead(null)
  }

  async function saveProspect(data){
    if(data.id){
      const{error}=await sb.from('prospects').update(data).eq('id',data.id)
      if(!error){setProspects(prev=>prev.map(p=>p.id===data.id?data:p));showToast('Prospecto actualizado ✅')}
    }else{
      const{data:np,error}=await sb.from('prospects').insert([{...data,created_at:new Date().toISOString()}]).select().single()
      if(!error){setProspects(prev=>[np,...prev]);showToast('Prospecto creado ✅')}
    }
    setShowProspectModal(false);setEditProspect(null)
  }

  async function convertProspectToLead(p){
    const{data:lead,error}=await sb.from('leads').insert([{country:p.country,empresa:p.empresa,contacto:p.contacto,puesto:p.puesto,email:p.email,status:'Primer Contacto',tier:tierFromVolumen(p.volumen_estimado),volumen:p.volumen_estimado||0,revenue:0,margen:0,progress_to_won:10,created_at:new Date().toISOString(),created_by:profile?.id}]).select().single()
    if(!error){
      setLeads(prev=>[lead,...prev])
      await sb.from('prospects').delete().eq('id',p.id)
      setProspects(prev=>prev.filter(x=>x.id!==p.id))
      showToast(`${p.empresa} → Lead ✅`)
    }
  }

  async function saveActivity(data){
    if(data.id){
      const{error}=await sb.from('activities').update(data).eq('id',data.id)
      if(!error){setActivities(prev=>prev.map(a=>a.id===data.id?{...a,...data}:a));showToast('Actividad actualizada ✅')}
      else showToast('Error al guardar','error')
    }else{
      const{data:act,error}=await sb.from('activities').insert([{...data,created_by:profile?.id}]).select().single()
      if(!error){
        setActivities(prev=>[act,...prev])
        await sb.from('leads').update({last_interaction:data.fecha}).eq('id',data.lead_id)
        setLeads(prev=>prev.map(l=>l.id===data.lead_id?{...l,last_interaction:data.fecha}:l))
        showToast('Actividad registrada ✅')
      }
    }
    setActivityLead(null);setEditActivityData(null)
  }

  async function toggleActivityDone(act){
    const{error}=await sb.from('activities').update({realizada:!act.realizada}).eq('id',act.id)
    if(!error){setActivities(prev=>prev.map(a=>a.id===act.id?{...a,realizada:!act.realizada}:a));showToast(act.realizada?'Marcada como pendiente':'Actividad completada ✅')}
  }

  async function saveProduct(data){
    if(data.id){
      const{error}=await sb.from('products').update(data).eq('id',data.id)
      if(!error){setProducts(prev=>prev.map(p=>p.id===data.id?data:p));showToast('Producto actualizado ✅')}
    }else{
      const{data:np,error}=await sb.from('products').insert([{...data,created_at:new Date().toISOString()}]).select().single()
      if(!error){setProducts(prev=>[np,...prev]);showToast('Producto creado ✅')}
    }
  }

  async function deleteProduct(product){
    const{error}=await sb.from('products').delete().eq('id',product.id)
    if(!error){setProducts(prev=>prev.filter(p=>p.id!==product.id));showToast(`${product.servicio} eliminado`)}
  }

  async function saveBPM(data){
    const table=accounts.find(a=>a.id===data.id)?'accounts':'leads'
    const{error}=await sb.from(table).update({bpm_tasks:data.bpm_tasks,servicio:data.servicio}).eq('id',data.id)
    if(!error){
      if(table==='accounts')setAccounts(prev=>prev.map(a=>a.id===data.id?{...a,bpm_tasks:data.bpm_tasks,servicio:data.servicio}:a))
      else setLeads(prev=>prev.map(l=>l.id===data.id?{...l,bpm_tasks:data.bpm_tasks,servicio:data.servicio}:l))
      showToast('BPM guardado ✅')
    }
    setBpmEntity(null)
  }

  async function convertToAccount(lead){
    if(accounts.find(a=>a.lead_id===lead.id)){showToast('Ya existe como cuenta','error');return}
    const{data:acc,error}=await sb.from('accounts').insert([{country:lead.country,empresa:lead.empresa,contacto:lead.contacto,email:lead.email,phone:lead.phone,volumen_actual:lead.volumen,revenue_actual:lead.revenue,margen_actual:lead.margen,status:'Activo',lead_id:lead.id,bpm_tasks:Object.fromEntries(BPM_TASKS.map(t=>[t,false])),servicio:{},created_at:new Date().toISOString()}]).select().single()
    if(!error){setAccounts(prev=>[acc,...prev]);showToast(`${lead.empresa} → Cuenta Activa ✅`)}
  }

  async function handleImport(batch){
    const rows=batch.map(r=>({...r,created_at:new Date().toISOString(),created_by:profile?.id}))
    const{error}=await sb.from('leads').insert(rows)
    if(error){showToast('Error en importación','error');return}
    await fetchAll()
  }

  async function handleImportProspects(batch){
    const rows=batch.map(r=>({...r,created_at:new Date().toISOString()}))
    const{error}=await sb.from('prospects').insert(rows)
    if(error){showToast('Error en importación','error');return}
    await fetchAll()
  }

  async function saveClientTariff(data){
    const now=new Date().toISOString()
    if(data.id){
      const{error}=await sb.from('client_tariffs').update({...data,updated_at:now}).eq('id',data.id)
      if(!error){setClientTariffs(prev=>prev.map(t=>t.id===data.id?{...data,updated_at:now}:t));showToast('Tarifa actualizada ✅')}
      else showToast('Error al guardar tarifa','error')
    }else{
      const{data:nt,error}=await sb.from('client_tariffs').insert([{...data,created_at:now,updated_at:now,created_by:profile?.id}]).select().single()
      if(!error){setClientTariffs(prev=>[nt,...prev]);showToast('Tarifa creada ✅')}
      else showToast('Error al crear tarifa','error')
    }
    setShowClientTariffModal(false);setEditClientTariff(null)
  }

  async function deleteClientTariff(tariff){
    const{error}=await sb.from('client_tariffs').delete().eq('id',tariff.id)
    if(!error){setClientTariffs(prev=>prev.filter(t=>t.id!==tariff.id));showToast('Tarifa eliminada')}
    else showToast('Error al eliminar','error')
  } (for sidebar badge)
  const pendingPricingCount = leads.filter(l =>
    l.pricing_proposal &&
    (l.pricing_proposal.approval_status === PRICING_STATUSES.PENDING_TOMAS ||
     l.pricing_proposal.approval_status === PRICING_STATUSES.PENDING_PEDRO)
  ).length

  const fLeads=countryFilter(leads)
  const fProspects=countryFilter(prospects)
  const fAccounts=countryFilter(accounts)
  const fProducts=countryFilter(products)

  return <div style={{display:'flex',height:'100vh',overflow:'hidden',background:'#0F1117',color:'#E2E8F0'}}>
    <aside style={{width:sidebarCollapsed?60:220,background:'#111212',borderRight:'1px solid #222',display:'flex',flexDirection:'column',transition:'width 0.2s',flexShrink:0,overflow:'hidden'}}>
      <div style={{padding:'12px',borderBottom:'1px solid #222',display:'flex',alignItems:'center',justifyContent:'center',minHeight:62}}>
        {sidebarCollapsed?<WynIcon size={36}/>:<WynLogoSmall height={28}/>}
      </div>
      {!sidebarCollapsed&&<div style={{padding:'10px 10px 6px'}}>
        {isRegional
          ?<select value={selectedCountry} onChange={e=>setSelectedCountry(e.target.value)} style={{width:'100%',background:'#1A1B1B',border:'1px solid #333',color:'#E2E8F0',borderRadius:7,padding:'6px 8px',fontSize:11,cursor:'pointer',outline:'none'}}>
            <option value="LATAM">🌎 LATAM</option>
            {COUNTRIES.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          :<div style={{background:'#5CBB0022',border:'1px solid #5CBB0044',borderRadius:7,padding:'6px 10px',fontSize:11,color:'#5CBB00',fontWeight:600}}>📍 {userCountry}</div>
        }
      </div>}
      <nav style={{flex:1,padding:'6px',display:'flex',flexDirection:'column',gap:1,overflowY:'auto'}}>
        {NAV.map(item=><button key={item.id} onClick={()=>setView(item.id)} style={{display:'flex',alignItems:'center',gap:9,padding:'8px 8px',borderRadius:7,border:'none',cursor:'pointer',background:view===item.id?'rgba(92,187,0,0.12)':'transparent',color:view===item.id?'#5CBB00':'#94A3B8',fontSize:12,fontWeight:view===item.id?600:400,textAlign:'left',borderLeft:`2px solid ${view===item.id?'#5CBB00':'transparent'}`,whiteSpace:'nowrap'}}>
          <span style={{fontSize:14,flexShrink:0}}>{item.icon}</span>
          {!sidebarCollapsed&&<span style={{flex:1}}>{item.label}</span>}
          {!sidebarCollapsed&&item.id==='pricing'&&pendingPricingCount>0&&<span style={{background:'#F97316',color:'white',fontSize:10,fontWeight:700,padding:'1px 6px',borderRadius:20,flexShrink:0}}>{pendingPricingCount}</span>}
        </button>)}
      </nav>
      {!sidebarCollapsed&&<div style={{padding:10,borderTop:'1px solid #1E2535'}}>
        <div style={{fontSize:11,color:'#64748B',marginBottom:5,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{profile?.email}</div>
        <div style={{marginBottom:8}}><Badge text={profile?.role==='regional'?'Regional':profile?.role==='manager'?'Manager':'Ejecutivo'} color={profile?.role==='regional'?'#8B5CF6':profile?.role==='manager'?'#F59E0B':'#3B82F6'}/></div>
        <button onClick={signOut} style={{width:'100%',background:'#1E2535',border:'1px solid #2D3748',color:'#94A3B8',borderRadius:7,padding:7,fontSize:11,cursor:'pointer'}}>Cerrar sesión</button>
      </div>}
      <button onClick={()=>setSidebarCollapsed(!sidebarCollapsed)} style={{margin:8,padding:7,background:'#1E2535',border:'1px solid #2D3748',borderRadius:7,color:'#64748B',cursor:'pointer',fontSize:11}}>{sidebarCollapsed?'→':'← Colapsar'}</button>
    </aside>

    <main style={{flex:1,overflow:'auto',display:'flex',flexDirection:'column'}}>
      <div style={{padding:'14px 22px',borderBottom:'1px solid #1E2535',display:'flex',alignItems:'center',justifyContent:'space-between',background:'#0A0D14',position:'sticky',top:0,zIndex:10,flexShrink:0}}>
        <div>
          <h1 style={{margin:0,fontSize:16,fontWeight:700,color:'#F1F5F9'}}>{NAV.find(n=>n.id===view)?.icon} {NAV.find(n=>n.id===view)?.label}</h1>
          <p style={{margin:0,fontSize:11,color:'#64748B'}}>{effectiveCountry==='LATAM'?'Vista LATAM':'País: '+effectiveCountry}</p>
        </div>
        <div style={{display:'flex',gap:8}}>
          {(view==='leads'||view==='pipeline')&&<>
            <button onClick={()=>setShowImport(true)} style={{padding:'8px 14px',borderRadius:8,border:'1px solid #2D3748',background:'transparent',color:'#94A3B8',fontSize:12,cursor:'pointer'}}>↑ Importar CSV</button>
            <button onClick={()=>setShowQuickLead(true)} style={{padding:'8px 14px',borderRadius:8,border:'1px solid #89D44A',background:'transparent',color:'#89D44A',fontSize:12,cursor:'pointer',fontWeight:600}}>+ Rápido</button>
            <GreenBtn onClick={()=>{setEditLead(null);setShowLeadModal(true)}}>+ Nuevo Lead</GreenBtn>
          </>}
          {view==='prospects'&&<><button onClick={()=>setShowImportProspects(true)} style={{padding:'8px 14px',borderRadius:8,border:'1px solid #2D3748',background:'transparent',color:'#94A3B8',fontSize:12,cursor:'pointer'}}>↑ Importar CSV</button><GreenBtn onClick={()=>{setEditProspect(null);setShowProspectModal(true)}}>+ Nuevo Prospecto</GreenBtn></>}
          {view==='client_tariffs'&&<GreenBtn onClick={()=>{setEditClientTariff(null);setShowClientTariffModal(true)}}>+ Nueva Tarifa</GreenBtn>}
        </div>
      </div>
      <div style={{padding:'20px 22px',flex:1}}>
        {error&&<div style={{background:'#EF444415',border:'1px solid #EF444440',borderRadius:10,padding:'14px 18px',marginBottom:18,fontSize:13,color:'#EF4444',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span>⚠️ {error}</span>
          <button onClick={fetchAll} style={{background:'#EF444422',border:'1px solid #EF444444',color:'#EF4444',borderRadius:6,padding:'4px 12px',fontSize:12,cursor:'pointer'}}>Reintentar</button>
        </div>}
        {loading?<Loader/>:<>
          {view==='dashboard'&&<DashboardView leads={fLeads} accounts={fAccounts} prospects={fProspects} activities={activities}/>}
          {view==='pipeline'&&<PipelineView leads={fLeads} activities={activities} onMoveStage={moveLead} onSelect={l=>setDetailLead(l)} onConfirmLoss={setLossLead}/>}
          {view==='leads'&&<LeadsView leads={fLeads} activities={activities} accounts={fAccounts} onEdit={l=>{setEditLead(l);setShowLeadModal(true)}} onActivity={l=>setActivityLead(l)} onBPM={l=>setBpmEntity(l)} onConvert={convertToAccount} onConfirmLoss={setLossLead} onDelete={deleteLead} onViewDetail={l=>setDetailLead(l)} onPricing={l=>setPricingLead(l)}/>}
          {view==='prospects'&&<ProspectsView prospects={fProspects} onEdit={p=>{setEditProspect(p);setShowProspectModal(true)}} onConvert={convertProspectToLead}/>}
          {view==='accounts'&&<AccountsView accounts={fAccounts} onBPM={setBpmEntity} onFicha={setFichaAccount}/>}
          {view==='activities'&&<ActivitiesView activities={activities} leads={fLeads} onEdit={(act,lead)=>{setEditActivityData({act,lead});setActivityLead(lead)}} onToggleDone={toggleActivityDone}/>}
          {view==='pricing'&&<PricingApprovalsView leads={fLeads} isRegional={isRegional} profile={profile} onOpenPricing={l=>{setPricingLead(l)}}/>}
          {view==='client_tariffs'&&<ClientTariffsView tariffs={countryFilter(clientTariffs)} isRegional={isRegional} onEdit={t=>{setEditClientTariff(t);setShowClientTariffModal(true)}} onDelete={deleteClientTariff} onNew={()=>{setEditClientTariff(null);setShowClientTariffModal(true)}}/>}
          {view==='products'&&<ProductsView products={fProducts} isRegional={isRegional} canEdit={isRegional||profile?.role==='ejecutivo'} userCountry={userCountry} onSave={saveProduct} onDelete={deleteProduct}/>}
          {view==='reports'&&<ReportsView leads={fLeads} accounts={fAccounts}/>}
        </>}
      </div>
    </main>

    {showQuickLead&&<QuickLeadModal onClose={()=>setShowQuickLead(false)} onSave={saveLead} defaultCountry={!isRegional?userCountry:undefined}/>}
    {showLeadModal&&<LeadModal lead={editLead} onClose={()=>{setShowLeadModal(false);setEditLead(null)}} onSave={saveLead} defaultCountry={!isRegional?userCountry:undefined}/>}
    {detailLead&&<LeadDetailModal lead={detailLead} onClose={()=>setDetailLead(null)} onEdit={l=>{setDetailLead(null);setEditLead(l);setShowLeadModal(true)}} activities={activities}/>}
    {showProspectModal&&<ProspectModal prospect={editProspect} onClose={()=>{setShowProspectModal(false);setEditProspect(null)}} onSave={saveProspect} defaultCountry={!isRegional?userCountry:undefined}/>}
    {bpmEntity&&<BPMModal entity={bpmEntity} onClose={()=>setBpmEntity(null)} onSave={saveBPM}/>}
    {fichaAccount&&<AccountFichaModal account={fichaAccount} onClose={()=>setFichaAccount(null)} profile={profile}/>}
    {activityLead&&<ActivityModal lead={activityLead} activity={editActivityData?.act||null} onClose={()=>{setActivityLead(null);setEditActivityData(null)}} onSave={saveActivity}/>}
    {showDailyAlert&&<DailyAlertModal activities={activities} leads={leads} onClose={()=>{setShowDailyAlert(false);setDailyAlertDismissed(true)}} onGo={()=>{setShowDailyAlert(false);setDailyAlertDismissed(true);setView('activities')}}/>}
    {lossLead&&<LossModal lead={lossLead} onClose={()=>setLossLead(null)} onConfirm={reason=>confirmLoss(lossLead,reason)}/>}
    {pricingLead&&<PricingApprovalModal lead={pricingLead} onClose={()=>setPricingLead(null)} onSave={data=>savePricingProposal(pricingLead,data)} isRegional={isRegional} profile={profile}/>}
    {showClientTariffModal&&<ClientTariffModal tariff={editClientTariff} onClose={()=>{setShowClientTariffModal(false);setEditClientTariff(null)}} onSave={saveClientTariff}/>}
    {showImport&&<ImportModal onClose={()=>{setShowImport(false);fetchAll()}} onImport={handleImport} defaultCountry={!isRegional?userCountry:'Chile'}/>}
    {showImportProspects&&<ImportProspectsModal onClose={()=>{setShowImportProspects(false);fetchAll()}} onImport={handleImportProspects} defaultCountry={!isRegional?userCountry:'Chile'}/>}
    {toast&&<div style={{position:'fixed',bottom:22,right:22,background:toast.type==='success'?'#5CBB00':'#EF4444',color:'white',padding:'11px 18px',borderRadius:10,fontSize:13,fontWeight:600,boxShadow:'0 8px 32px rgba(0,0,0,0.4)',zIndex:9999,animation:'slideIn 0.3s ease'}}>{toast.msg}</div>}
  </div>
}

function AppContent(){
  const{user,loading}=useAuth()
  if(loading)return <div style={{minHeight:'100vh',background:'#080C12',display:'flex',alignItems:'center',justifyContent:'center'}}>
    <div style={{textAlign:'center',color:'#64748B',fontSize:14}}>
      <div style={{marginBottom:16,display:'flex',justifyContent:'center'}}><WynLogo height={32}/></div>
      <div>Cargando...</div>
    </div>
  </div>
  return user?<CRMApp/>:<LoginPage/>
}

function App(){return <AuthProvider><AppContent/></AuthProvider>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
</script>
</body>
</html>
