function getPricingApprovalLevel(discountPct) {
  if (discountPct <= 0) return PRICING_APPROVAL_LEVELS.NONE
  if (discountPct <= 15) return PRICING_APPROVAL_LEVELS.TOMAS
  return PRICING_APPROVAL_LEVELS.PEDRO
}

function getPricingStatusFromLevel(level) {
  if (level === PRICING_APPROVAL_LEVELS.NONE) return PRICING_STATUSES.READY
  if (level === PRICING_APPROVAL_LEVELS.TOMAS) return PRICING_STATUSES.PENDING_TOMAS
  return PRICING_STATUSES.PENDING_PEDRO
}

function daysSince(d){if(!d)return 999;return Math.floor((Date.now()-new Date(d).getTime())/(86400000))}
function isStale(lead,activities){
  if(lead.status==='Ganado'||lead.status==='Perdido')return false
  const acts=activities.filter(a=>a.lead_id===lead.id)
  if(!acts.length)return daysSince(lead.last_interaction)>STALE_DAYS
  const latest=acts.reduce((a,b)=>new Date(a.fecha)>new Date(b.fecha)?a:b)
  return daysSince(latest.fecha)>STALE_DAYS
}
function validateLead(f){
  const e={}
  if(!f.empresa?.trim())e.empresa='Requerido'
  if(!f.country)e.country='Requerido'
  if(f.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email))e.email='Email inválido'
  if(f.volumen!==''&&f.volumen<0)e.volumen='Positivo'
  if(f.progress_to_won<0||f.progress_to_won>100)e.progress_to_won='0-100'
  return e
}
function exportToCSV(data,filename){
  if(!data.length)return
  const keys=Object.keys(data[0]).filter(k=>!['bpm_tasks','servicio'].includes(k))
  const csv=[keys.join(','),...data.map(r=>keys.map(k=>{const v=r[k]??'';return typeof v==='string'&&v.includes(',')? `"${v}"`:v}).join(','))].join('\n')
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=filename;a.click()
}

// ── AUTH CONTEXT ──────────────────────────────────────────
const AuthContext = createContext({})
function AuthProvider({children}){
  const [user,setUser]=useState(null)
  const [profile,setProfile]=useState(null)
  const [loading,setLoading]=useState(true)
  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{
      setUser(session?.user??null)
      if(session?.user)fetchProfile(session.user.id)
      else setLoading(false)
    })
    const {data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>{
      setUser(session?.user??null)
      if(session?.user)fetchProfile(session.user.id)
      else{setProfile(null);setLoading(false)}
    })
    return()=>subscription.unsubscribe()
  },[])
  async function fetchProfile(id){
    const{data}=await sb.from('profiles').select('*').eq('id',id).single()
    setProfile(data);setLoading(false)
  }
  async function signIn(email,password){return await sb.auth.signInWithPassword({email,password})}
  async function signOut(){await sb.auth.signOut()}
  const isRegional=profile?.role==='regional'
  const isManager=profile?.role==='manager'||profile?.role==='regional'
  return <AuthContext.Provider value={{user,profile,loading,signIn,signOut,isRegional,isManager,userCountry:profile?.country}}>{children}</AuthContext.Provider>
}
const useAuth=()=>useContext(AuthContext)

function QuickLeadModal({onClose,onSave,defaultCountry}){
  const[form,setForm]=useState({country:defaultCountry||'',empresa:'',contacto:'',status:'Primer Contacto'})
  const[saving,setSaving]=useState(false)
  const[error,setError]=useState('')
  const f=(k,v)=>setForm(p=>({...p,[k]:v}))
  async function handleSave(){
    if(!form.empresa.trim()){setError('El nombre de empresa es requerido');return}
    if(!form.country){setError('Seleccioná un país');return}
    setSaving(true)
    await onSave({...form,tier:'Tier 3',volumen:0,revenue:0,margen:0,tarifa:0,progress_to_won:10})
    setSaving(false)
  }
  return <Modal title="Nuevo Lead Rápido" onClose={onClose} subtitle="Completá los datos esenciales">
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <FInput label="País" value={form.country} onChange={v=>f('country',v)} options={COUNTRIES} required/>
      <FInput label="Empresa" value={form.empresa} onChange={v=>f('empresa',v)} required/>
      <FInput label="Contacto" value={form.contacto} onChange={v=>f('contacto',v)}/>
      <FInput label="Status" value={form.status} onChange={v=>f('status',v)} options={PIPELINE_STAGES}/>
      {error&&<div style={{background:'#EF444415',border:'1px solid #EF444440',borderRadius:8,padding:'8px 12px',fontSize:12,color:'#EF4444'}}>{error}</div>}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginTop:6}}>
        <span style={{fontSize:11,color:'#64748B'}}>Podés completar más datos luego desde la vista de Leads</span>

          <button onClick={onClose} style={{background:'#1E2535',border:'1px solid #2D3748',color:'#94A3B8',borderRadius:8,padding:'9px 16px',fontSize:13,cursor:'pointer'}}>Cancelar</button>
          <GreenBtn onClick={handleSave} disabled={saving}>{saving?'Guardando...':'Crear Lead'}</GreenBtn>
        </div>
      </div>
    </div>
  </Modal>
}

  return <div style={{display:'flex',flexDirection:'column',gap:8}}>
    {[...history].reverse().map((h,i)=>(
      <div key={i} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'10px 12px',background:'#1A1F2E',borderRadius:8,border:'1px solid #1E2535'}}>
        <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:2,flexShrink:0}}>
          <div style={{width:8,height:8,borderRadius:'50%',background:stageColor(h.to),marginTop:3}}/>
          {i<history.length-1&&<div style={{width:1,height:16,background:'#2D3748'}}/>}
        </div>
        <div style={{flex:1}}>
          <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
            <Badge text={h.from||'Inicio'} color={stageColor(h.from)||'#64748B'}/>
            <span style={{color:'#64748B',fontSize:11}}>→</span>
            <Badge text={h.to} color={stageColor(h.to)}/>
            {h.loss_reason&&<Badge text={h.loss_reason} color="#EF4444"/>}
          </div>
          <div style={{fontSize:11,color:'#64748B',marginTop:4}}>
            {h.at?new Date(h.at).toLocaleDateString('es-AR',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—'}
            {h.by&&<span style={{marginLeft:6}}>· {h.by}</span>}
          </div>
        </div>
      </div>
    ))}
  </div>
}

          <span style={{fontSize:16}}>{ACTIVITY_ICONS[act.tipo]||'📌'}</span>

// ── BPM MODAL ─────────────────────────────────────────────
function BPMModal({entity,onClose,onSave}){
  const[form,setForm]=useState({...entity,bpm_tasks:entity?.bpm_tasks||Object.fromEntries(BPM_TASKS.map(t=>[t,false])),servicio:entity?.servicio||{}})
  const[saving,setSaving]=useState(false)
  const s=form.servicio||{}
  const setS=(k,v)=>setForm(p=>({...p,servicio:{...p.servicio,[k]:v}}))
  const toggleTask=t=>setForm(p=>({...p,bpm_tasks:{...p.bpm_tasks,[t]:!p.bpm_tasks[t]}}))
  const done=Object.values(form.bpm_tasks||{}).filter(Boolean).length
  const pct=Math.round((done/BPM_TASKS.length)*100)
  const SECTIONS=[
    {title:'📋 Definición de Servicio',color:'#5CBB00',fields:[{l:'Modalidad',k:'modalidad',opts:MODALITIES},{l:'País',k:'pais',opts:COUNTRIES},{l:'Tipo Entrega',k:'tipo_entrega',opts:DELIVERY_TYPES},{l:'Cash on Delivery',k:'cash_on_delivery',opts:['Sí','No']},{l:'Observaciones',k:'observaciones',wide:true},{l:'Fecha Requerimiento',k:'fecha_requerimiento',type:'date'}]},
    {title:'🔌 Integración',color:'#8B5CF6',fields:[{l:'Tipo',k:'integracion',opts:INTEGRATION_TYPES},{l:'Moneda',k:'moneda',opts:CURRENCIES},{l:'Etiqueta',k:'etiqueta'},{l:'Tracking Number',k:'tracking_number'},{l:'Obligaciones',k:'obligaciones',wide:true},{l:'Eventos Mandatorios',k:'eventos_mandatorios',wide:true}]},
    {title:'⚙️ Operativo',color:'#F59E0B',fields:[{l:'Cut Off',k:'cut_off'},{l:'Intentos',k:'intentos_entrega',type:'number'},{l:'Retornos',k:'retornos',opts:RETURN_TYPES},{l:'Cobertura',k:'cobertura'},{l:'Prealerta',k:'prealerta'},{l:'Comentarios',k:'comentarios_op',wide:true}]},
    {title:'🧾 Facturación',color:'#007B84',fields:[{l:'Modalidad',k:'modalidad_fact',opts:MODALITIES},{l:'Evento Facturador',k:'billing_event',opts:BILLING_EVENTS},{l:'Período',k:'periodo'}]}
  ]
  return <Modal title={`BPM — ${entity?.empresa}`} onClose={onClose} wide>
    <div style={{display:'grid',gridTemplateColumns:'220px 1fr',gap:22}}>
      <div>
        <div style={{fontSize:11,color:'#64748B',textTransform:'uppercase',letterSpacing:1,marginBottom:12}}>Tracking</div>
        <div style={{marginBottom:14}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
            <span style={{fontSize:11,color:'#64748B'}}>Progreso</span>
            <span style={{fontSize:12,fontWeight:700,color:pct===100?'#5CBB00':'#F59E0B'}}>{pct}%</span>
          </div>
          <div style={{height:7,background:'#1E2535',borderRadius:4}}>
            <div style={{width:`${pct}%`,height:'100%',background:pct===100?'#5CBB00':'linear-gradient(90deg,#F59E0B,#5CBB00)',borderRadius:4,transition:'width 0.3s'}}/>
          </div>
        </div>
        {BPM_TASKS.map(t=><div key={t} onClick={()=>toggleTask(t)} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 10px',background:form.bpm_tasks[t]?'#5CBB0015':'#141820',border:`1px solid ${form.bpm_tasks[t]?'#5CBB00':'#1E2535'}`,borderRadius:8,cursor:'pointer',marginBottom:5}}>
          <div style={{width:18,height:18,borderRadius:4,border:`2px solid ${form.bpm_tasks[t]?'#5CBB00':'#475569'}`,background:form.bpm_tasks[t]?'#5CBB00':'transparent',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,color:'white',flexShrink:0}}>{form.bpm_tasks[t]?'✓':''}</div>
          <span style={{fontSize:12,color:form.bpm_tasks[t]?'#5CBB00':'#94A3B8',fontWeight:form.bpm_tasks[t]?600:400}}>{t}</span>
        </div>)}
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:14,overflowY:'auto',maxHeight:'65vh'}}>
        {SECTIONS.map(section=><div key={section.title} style={{background:'#1A2235',border:'1px solid #1E2D42',borderRadius:10,padding:14}}>
          <div style={{fontSize:12,fontWeight:700,color:section.color,marginBottom:12}}>{section.title}</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            {section.fields.map(field=><div key={field.k} style={field.wide?{gridColumn:'1/-1'}:{}}>
              <FInput label={field.l} value={s[field.k]||''} onChange={v=>setS(field.k,v)} options={field.opts} type={field.type||'text'}/>
            </div>)}
          </div>
        </div>)}
      </div>
    </div>
    <div style={{display:'flex',justifyContent:'flex-end',gap:10,marginTop:20}}>
      <button onClick={onClose} style={{background:'#1E2535',border:'1px solid #2D3748',color:'#94A3B8',borderRadius:8,padding:'9px 16px',fontSize:13,cursor:'pointer'}}>Cancelar</button>
      <GreenBtn onClick={async()=>{setSaving(true);await onSave(form);setSaving(false)}} disabled={saving}>{saving?'Guardando...':'Guardar BPM'}</GreenBtn>
    </div>
  </Modal>
}

// ── PRICING APPROVAL MODAL ────────────────────────────────
function PricingApprovalModal({lead, onClose, onSave, isRegional, profile}) {
  const existing = lead?.pricing_proposal || {}
  const leadCountry = lead?.country || ''
  const countryData = BASE_TARIFFS[leadCountry] || null
  const defaultZone = countryData ? countryData.zones[0] : ''

  const [form, setForm] = useState({
    zona: existing.zona || defaultZone,
    servicio: existing.servicio || 'Next Day',
    cod: existing.cod || false,
    tarifa_base: existing.tarifa_base || '',
    tarifa_propuesta: existing.tarifa_propuesta || '',
    volumen_est: existing.volumen_est || lead?.volumen || '',
    justificacion: existing.justificacion || '',
    exception_category: existing.exception_category || '',
    review_date: existing.review_date || '',
    approval_status: existing.approval_status || '',
    approval_note: existing.approval_note || '',
    conditions_note: existing.conditions_note || '',
    conditions_approved: existing.conditions_approved || false,
  })
  const [saving, setSaving] = useState(false)
  const [step, setStep] = useState(existing.approval_status === 'Aprobada' || existing.approval_status === 'Lista para enviar' ? 'conditions' : 'tariff')

  const f = (k,v) => {
    const next = {...form, [k]:v}
    if(k==='zona' || k==='servicio') {
      if(countryData && countryData.tariffs[next.zona]) {
        const base = countryData.tariffs[next.zona][next.servicio]
        if(base) next.tarifa_base = base.toString()
      }
    }
    setForm(next)
  }

  const tarifaBase = parseFloat(form.tarifa_base) || 0
  const tarifaProp = parseFloat(form.tarifa_propuesta) || tarifaBase
  const discountPct = tarifaBase > 0 ? Math.max(0, ((tarifaBase - tarifaProp) / tarifaBase) * 100) : 0
  const level = getPricingApprovalLevel(discountPct)

  const approver = level === PRICING_APPROVAL_LEVELS.PEDRO ? APPROVERS.pedro : level === PRICING_APPROVAL_LEVELS.TOMAS ? APPROVERS.tomas : null
  const isOnboarding = existing.conditions_approved

  const levelInfo = {
    none:  {label:'Sin descuento', color:'#5CBB00', icon:'✅', desc:'Tarifa pública — aprobación automática. Podés enviar al cliente directo.'},
    tomas: {label:'Aprueba Tomás Cebrál', color:'#F59E0B', icon:'🟡', desc:'Descuento 1–15% — requiere aprobación de Tomás Cebrál (Regional) antes de enviar.'},
    pedro: {label:'Aprueba Pedro Torello', color:'#EF4444', icon:'🔴', desc:'Descuento >15% — requiere aprobación de Pedro Torello (Dirección).'},
  }[level]

  const canApproveDiscount = isRegional && level !== PRICING_APPROVAL_LEVELS.NONE
  const canApproveConditions = isRegional

  async function handleSave(overrideStatus, extra={}) {
    setSaving(true)
    const autoStatus = overrideStatus || getPricingStatusFromLevel(level)
    const proposal = {
      ...form,
      ...extra,
      discount_pct: parseFloat(discountPct.toFixed(2)),
      approval_level: level,
      approval_status: overrideStatus || form.approval_status || autoStatus,
      updated_at: new Date().toISOString(),
      updated_by: profile?.email || '',
    }
    await onSave({ pricing_proposal: proposal })
    setSaving(false)
    onClose()
  }

  const stepStyle = (s) => ({
    padding:'6px 14px', borderRadius:20, border:`1px solid ${step===s?'#5CBB00':'#2D3748'}`,
    background:step===s?'#5CBB0022':'transparent', color:step===s?'#5CBB00':'#64748B',
    fontSize:12, cursor:'pointer', fontWeight:step===s?600:400
  })

  return <Modal title={`Propuesta Comercial — ${lead?.empresa}`} onClose={onClose} wide subtitle={`${lead?.country} · ${lead?.status}`}>

    {/* Step tabs */}
    <div style={{display:'flex',gap:8,marginBottom:18}}>
      <button style={stepStyle('tariff')} onClick={()=>setStep('tariff')}>1 · Tarifa y descuento</button>
      <button style={stepStyle('conditions')} onClick={()=>setStep('conditions')}>2 · Condiciones y alta</button>
      {existing.approval_status && <div style={{marginLeft:'auto',display:'flex',alignItems:'center',gap:8}}>
        <span style={{fontSize:11,color:'#64748B'}}>Estado:</span>
        <Badge text={existing.approval_status} color={PRICING_STATUS_COLORS[existing.approval_status]||'#64748B'}/>
      </div>}
    </div>

    {/* ── STEP 1: TARIFF ── */}
    {step==='tariff' && <div style={{display:'flex',flexDirection:'column',gap:14}}>

      {/* Country tariff reference */}
      {countryData && <div style={{background:'#141820',border:'1px solid #1E2535',borderRadius:10,padding:14}}>
        <div style={{fontSize:11,color:'#64748B',textTransform:'uppercase',letterSpacing:.8,marginBottom:10}}>Tarifas base — {leadCountry}</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(150px,1fr))',gap:8}}>
          {countryData.zones.map(zone=><div key={zone} style={{background:'#1A1F2E',borderRadius:8,padding:'10px 12px'}}>
            <div style={{fontSize:11,fontWeight:600,color:'#94A3B8',marginBottom:6}}>{zone}</div>
            {SERVICES.map(svc=>{
              const price = countryData.tariffs[zone][svc]
              const isSelected = form.zona===zone && form.servicio===svc
              return <div key={svc} onClick={()=>{if(price){f('zona',zone);f('servicio',svc)}}} style={{display:'flex',justifyContent:'space-between',padding:'4px 6px',borderRadius:5,marginBottom:2,cursor:price?'pointer':'default',background:isSelected?'#5CBB0022':price?'transparent':'transparent',border:isSelected?'1px solid #5CBB0044':'1px solid transparent'}}>
                <span style={{fontSize:11,color:price?'#94A3B8':'#3D4A5C'}}>{svc}</span>
                <span style={{fontSize:11,fontWeight:600,color:price?(isSelected?'#5CBB00':'#F1F5F9'):'#3D4A5C'}}>{price?`USD ${price.toFixed(2)}`:'—'}</span>
              </div>
            })}
          </div>)}
        </div>
        {countryData.cod && <div style={{marginTop:8,display:'flex',alignItems:'center',gap:8}}>
          <label style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',fontSize:12,color:'#94A3B8'}}>
            <input type="checkbox" checked={form.cod} onChange={e=>f('cod',e.target.checked)} style={{width:15,height:15}}/>
            COD (Cash on Delivery)
            {form.cod && <Badge text="Activo" color="#5CBB00"/>}
          </label>
        </div>}
        {!countryData.cod && <div style={{marginTop:8,fontSize:11,color:'#64748B'}}>⚠ COD no disponible en {leadCountry}</div>}
      </div>}

      {/* Tarifa seleccionada y propuesta */}
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12}}>
        <div style={{background:'#1A1F2E',borderRadius:8,padding:'10px 12px'}}>
          <div style={{fontSize:10,color:'#64748B',textTransform:'uppercase',marginBottom:4}}>Zona seleccionada</div>
          <div style={{fontSize:14,fontWeight:700,color:'#F1F5F9'}}>{form.zona||'—'}</div>
        </div>
        <div style={{background:'#1A1F2E',borderRadius:8,padding:'10px 12px'}}>
          <div style={{fontSize:10,color:'#64748B',textTransform:'uppercase',marginBottom:4}}>Servicio</div>
          <div style={{fontSize:14,fontWeight:700,color:'#F1F5F9'}}>{form.servicio||'—'}</div>
        </div>
        <div style={{background:'#1A1F2E',borderRadius:8,padding:'10px 12px'}}>
          <div style={{fontSize:10,color:'#64748B',textTransform:'uppercase',marginBottom:4}}>Tarifa base (USD)</div>
          <div style={{fontSize:14,fontWeight:700,color:'#5CBB00'}}>{form.tarifa_base?`USD ${parseFloat(form.tarifa_base).toFixed(2)}`:'—'}</div>
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <FInput label="Tarifa propuesta al cliente (USD)" value={form.tarifa_propuesta} onChange={v=>f('tarifa_propuesta',v)} type="number"/>
        <FInput label="Volumen estimado (envíos/mes)" value={form.volumen_est} onChange={v=>f('volumen_est',v)} type="number"/>
      </div>

      {/* Descuento badge */}
      <div style={{background:'#1A1F2E',border:`2px solid ${levelInfo.color}44`,borderRadius:10,padding:'14px 16px',display:'flex',alignItems:'center',gap:14}}>
        <div style={{fontSize:26}}>{levelInfo.icon}</div>
        <div style={{flex:1}}>
          <div style={{display:'flex',alignItems:'baseline',gap:10,marginBottom:4}}>
            <span style={{fontSize:24,fontWeight:700,color:levelInfo.color}}>{discountPct.toFixed(1)}%</span>
            <span style={{fontSize:12,color:'#94A3B8'}}>descuento sobre tarifa base</span>
            <span style={{marginLeft:'auto',background:levelInfo.color+'22',color:levelInfo.color,fontSize:11,fontWeight:700,padding:'3px 10px',borderRadius:20}}>{levelInfo.label}</span>
          </div>
          <div style={{fontSize:11,color:'#64748B'}}>{levelInfo.desc}</div>
        </div>
      </div>

      {/* Justificación si hay descuento */}
      {level !== PRICING_APPROVAL_LEVELS.NONE && <div>
        <label style={{fontSize:11,color:'#94A3B8',textTransform:'uppercase',display:'block',marginBottom:6}}>Justificación *</label>
        <textarea value={form.justificacion} onChange={e=>f('justificacion',e.target.value)} rows={2} placeholder="Ej: cliente volumen ancla, apertura mercado, strategic account..." style={{width:'100%',background:'#1E2535',border:'1px solid #2D3748',color:'#E2E8F0',borderRadius:8,padding:'8px 10px',fontSize:13,resize:'vertical',outline:'none',boxSizing:'border-box'}}/>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12,marginTop:10}}>
          <FInput label="Categoría de excepción (opcional)" value={form.exception_category} onChange={v=>f('exception_category',v)} options={EXCEPTION_CATEGORIES}/>
          <FInput label="Fecha de revisión obligatoria" value={form.review_date} onChange={v=>f('review_date',v)} type="date"/>
        </div>
      </div>}

      {/* Approval panel */}
      {canApproveDiscount && level !== PRICING_APPROVAL_LEVELS.NONE && <div style={{background:'#0D1B2A',border:'1px solid #1E3A5F',borderRadius:10,padding:14}}>
        <div style={{fontSize:12,fontWeight:700,color:'#3B82F6',marginBottom:10}}>
          🔐 Panel de aprobación — {approver?.name} ({approver?.role})
        </div>
        <label style={{fontSize:11,color:'#94A3B8',textTransform:'uppercase',display:'block',marginBottom:6}}>Nota del aprobador</label>
        <textarea value={form.approval_note} onChange={e=>f('approval_note',e.target.value)} rows={2} placeholder="Condiciones, límites o comentarios de la aprobación..." style={{width:'100%',background:'#1E2535',border:'1px solid #2D3748',color:'#E2E8F0',borderRadius:8,padding:'8px 10px',fontSize:13,resize:'vertical',outline:'none',boxSizing:'border-box',marginBottom:10}}/>
        <div style={{display:'flex',gap:10}}>
          <button onClick={()=>handleSave('Aprobada')} disabled={saving||!form.justificacion} style={{flex:1,background:'#5CBB0022',border:'1px solid #5CBB00',color:'#5CBB00',borderRadius:8,padding:'9px 16px',fontSize:13,fontWeight:700,cursor:'pointer'}}>✅ Aprobar propuesta</button>
          <button onClick={()=>handleSave('Rechazada')} disabled={saving} style={{flex:1,background:'#EF444422',border:'1px solid #EF4444',color:'#EF4444',borderRadius:8,padding:'9px 16px',fontSize:13,fontWeight:700,cursor:'pointer'}}>❌ Rechazar</button>
        </div>
      </div>}

      <div style={{display:'flex',justifyContent:'flex-end',gap:10}}>
        <button onClick={onClose} style={{background:'#1E2535',border:'1px solid #2D3748',color:'#94A3B8',borderRadius:8,padding:'9px 16px',fontSize:13,cursor:'pointer'}}>Cancelar</button>
        <GreenBtn onClick={()=>handleSave()} disabled={saving||(level!==PRICING_APPROVAL_LEVELS.NONE&&!form.justificacion)}>
          {saving?'Guardando...': level===PRICING_APPROVAL_LEVELS.NONE?'Confirmar tarifa pública →':'Guardar y enviar a aprobación →'}
        </GreenBtn>
      </div>
    </div>}

    {/* ── STEP 2: CONDITIONS & ONBOARDING ── */}
    {step==='conditions' && <div style={{display:'flex',flexDirection:'column',gap:14}}>

      {/* Summary */}
      <div style={{background:'#1A1F2E',border:'1px solid #1E2535',borderRadius:10,padding:14,display:'grid',gridTemplateColumns:'repeat(4,1fr)',gap:10}}>
        {[['País',lead?.country],['Zona',existing.zona||'—'],['Servicio',existing.servicio||'—'],['Tarifa',existing.tarifa_propuesta?`USD ${parseFloat(existing.tarifa_propuesta).toFixed(2)}`:'—']].map(([k,v])=><div key={k}>
          <div style={{fontSize:10,color:'#64748B',textTransform:'uppercase',marginBottom:3}}>{k}</div>
          <div style={{fontSize:13,fontWeight:600,color:'#F1F5F9'}}>{v}</div>
        </div>)}

// ── PRICING APPROVAL VIEW ────────────────────────────────
function PricingApprovalsView({leads, isRegional, profile, onOpenPricing}) {
  const proposals = leads.filter(l => l.pricing_proposal)
  const pendingTomas = proposals.filter(l => l.pricing_proposal.approval_status === PRICING_STATUSES.PENDING_TOMAS)
  const pendingPedro = proposals.filter(l => l.pricing_proposal.approval_status === PRICING_STATUSES.PENDING_PEDRO)
  const pendingConditions = proposals.filter(l => l.pricing_proposal.approval_status === PRICING_STATUSES.CONDITIONS_REVIEW)
  const approved = proposals.filter(l => l.pricing_proposal.approval_status === 'Aprobada' || l.pricing_proposal.conditions_approved)
  const rejected = proposals.filter(l => l.pricing_proposal.approval_status === 'Rechazada')
  const today = new Date().toISOString().split('T')[0]
  const expiredReview = proposals.filter(l => l.pricing_proposal.review_date && l.pricing_proposal.review_date < today && l.pricing_proposal.approval_status === 'Aprobada')
  const avgDiscount = proposals.length > 0 ? (proposals.reduce((s,l)=>s+(l.pricing_proposal.discount_pct||0),0)/proposals.length).toFixed(1) : 0
  const pending = [...pendingTomas, ...pendingPedro, ...pendingConditions]

  const ApproverCard = ({label, person, count, color}) => <div style={{background:'#141820',border:`1px solid ${color}44`,borderRadius:10,padding:14,flex:1,minWidth:140}}>
    <div style={{fontSize:10,color:'#64748B',textTransform:'uppercase',letterSpacing:.8,marginBottom:8}}>{label}</div>
    <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
      <div style={{width:30,height:30,borderRadius:'50%',background:color+'22',display:'flex',alignItems:'center',justifyContent:'center',fontSize:11,fontWeight:700,color,flexShrink:0}}>{person.name.split(' ').map(n=>n[0]).join('')}</div>
      <div><div style={{fontSize:12,fontWeight:600,color:'#F1F5F9'}}>{person.name}</div><div style={{fontSize:10,color:'#64748B'}}>{person.role} · {person.range}</div></div>
    </div>
    <div style={{fontSize:22,fontWeight:700,color}}>{count}</div>
  </div>

  return <div style={{display:'flex',flexDirection:'column',gap:18}}>
    <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
      <ApproverCard label="Pendientes T. Cebrál" person={APPROVERS.tomas} count={pendingTomas.length} color="#F59E0B"/>
      <ApproverCard label="Pendientes P. Torello" person={APPROVERS.pedro} count={pendingPedro.length} color="#EF4444"/>
      <StatCard label="Revisión condiciones" value={pendingConditions.length} icon="📋" color="#8B5CF6"/>
      <StatCard label="Aprobadas" value={approved.length} icon="✅" color="#5CBB00"/>
      <StatCard label="Avg descuento" value={`${avgDiscount}%`} icon="📊" color="#64748B"/>
    </div>

    {expiredReview.length > 0 && <div style={{background:'#EF444415',border:'1px solid #EF444433',borderRadius:10,padding:'12px 16px'}}>
      <div style={{fontSize:12,fontWeight:700,color:'#EF4444',marginBottom:6}}>⚠️ {expiredReview.length} excepción(es) con fecha de revisión vencida</div>
      {expiredReview.map(l=><div key={l.id} style={{fontSize:12,color:'#F87171'}}>• {l.empresa} ({l.country}) — revisión: {l.pricing_proposal.review_date}</div>)}
    </div>}

    {pending.length > 0 && <div>
      <div style={{fontSize:11,fontWeight:700,color:'#94A3B8',textTransform:'uppercase',letterSpacing:1,marginBottom:10}}>Pendientes de aprobación</div>
      {pending.map(l => {
        const p = l.pricing_proposal
        const isConditions = p.approval_status === PRICING_STATUSES.CONDITIONS_REVIEW
        const isPedro = p.approval_status === PRICING_STATUSES.PENDING_PEDRO
        const color = isConditions ? '#8B5CF6' : isPedro ? '#EF4444' : '#F59E0B'
        const approverLabel = isConditions ? 'Condiciones → T. Cebrál' : isPedro ? 'P. Torello' : 'T. Cebrál'
        return <div key={l.id} style={{background:'#1A1F2E',border:`1px solid ${color}44`,borderRadius:10,padding:'12px 16px',marginBottom:8,display:'flex',alignItems:'center',gap:14}}>
          <div style={{flex:1}}>
            <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4,flexWrap:'wrap'}}>
              <span style={{fontSize:13,fontWeight:700,color:'#F1F5F9'}}>{l.empresa}</span>
              <Badge text={l.country} color="#64748B"/>
              {p.zona && <Badge text={p.zona} color="#475569"/>}
              {p.servicio && <Badge text={p.servicio} color="#475569"/>}
              <Badge text={`${(p.discount_pct||0).toFixed(1)}% desc.`} color={color}/>
              <Badge text={approverLabel} color={color}/>
            </div>
            <div style={{fontSize:11,color:'#64748B'}}>
              Tarifa base: USD {p.tarifa_base} → propuesta: USD {p.tarifa_propuesta}
              {p.justificacion && <span style={{marginLeft:8,color:'#94A3B8'}}>· {p.justificacion.substring(0,60)}{p.justificacion.length>60?'...':''}</span>}
            </div>
          </div>
          {isRegional && <GreenBtn small onClick={()=>onOpenPricing(l)}>Revisar →</GreenBtn>}
        </div>
      })}
    </div>}

    <Card style={{padding:0,overflow:'hidden'}}>
      <div style={{padding:'12px 16px',borderBottom:'1px solid #1E2535'}}>
        <span style={{fontSize:12,fontWeight:600,color:'#94A3B8'}}>Todas las propuestas</span>
      </div>
      <div style={{overflowX:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead><tr style={{borderBottom:'1px solid #1E2535'}}>
            {['País','Empresa','Zona','Servicio','Desc. %','Aprobador','Estado','Revisión',''].map(h=>(
              <th key={h} style={{padding:'10px 12px',fontSize:10,color:'#64748B',textTransform:'uppercase',textAlign:'left',background:'#0F1117'}}>{h}</th>
            ))}
          </tr></thead>
          <tbody>
            {proposals.length === 0
              ? <tr><td colSpan={9} style={{padding:30,textAlign:'center',color:'#475569'}}>No hay propuestas registradas</td></tr>
              : proposals.map(l => {
                  const p = l.pricing_proposal
                  const isExpired = p.review_date && p.review_date < today
                  return <tr key={l.id} style={{borderBottom:'1px solid #1E253550'}}>
                    <td style={{padding:'9px 12px',fontSize:11,color:'#94A3B8'}}>{l.country}</td>
                    <td style={{padding:'9px 12px',fontSize:13,fontWeight:600,color:'#F1F5F9'}}>{l.empresa}</td>
                    <td style={{padding:'9px 12px',fontSize:11,color:'#64748B'}}>{p.zona||'—'}</td>
                    <td style={{padding:'9px 12px',fontSize:11,color:'#64748B'}}>{p.servicio||'—'}</td>
                    <td style={{padding:'9px 12px'}}><Badge text={`${(p.discount_pct||0).toFixed(1)}%`} color={p.discount_pct>15?'#EF4444':p.discount_pct>0?'#F59E0B':'#5CBB00'}/></td>
                    <td style={{padding:'9px 12px',fontSize:11,color:'#94A3B8'}}>{p.discount_pct>15?'P. Torello':p.discount_pct>0?'T. Cebrál':'Automático'}</td>
                    <td style={{padding:'9px 12px'}}><Badge text={p.approval_status||'—'} color={PRICING_STATUS_COLORS[p.approval_status]||'#64748B'}/></td>
                    <td style={{padding:'9px 12px',fontSize:11,color:isExpired?'#EF4444':'#64748B'}}>{p.review_date||'—'}{isExpired&&' ⚠️'}</td>
                    <td style={{padding:'9px 12px'}}><MiniBtn onClick={()=>onOpenPricing(l)} color="#3B82F6">Ver →</MiniBtn></td>
                  </tr>
                })
            }
          </tbody>
        </table>
      </div>
    </Card>
  </div>
}

function LeadModal({lead,onClose,onSave,defaultCountry}){
  const[form,setForm]=useState(lead||{country:defaultCountry||'',empresa:'',contacto:'',puesto:'',email:'',phone:'',status:'Primer Contacto',tier:'Tier 3',volumen:'',revenue:'',margen:'',tarifa:'',expected_close:'',progress_to_won:10,last_interaction:'',next_step:'',comments:'',loss_reason:''})
  const[errors,setErrors]=useState({})
  const[saving,setSaving]=useState(false)
  const f=(k,v)=>{
    const u={...form,[k]:v}
    if(k==='volumen'&&v)u.tier=tierFromVolumen(v)
    setForm(u)
    if(errors[k])setErrors(p=>{const e={...p};delete e[k];return e})
  }
  async function handleSave(){
    const errs=validateLead(form)
    if(Object.keys(errs).length){setErrors(errs);return}
    setSaving(true);await onSave(form);setSaving(false)
  }
  return <Modal title={lead?`Editar — ${lead.empresa}`:'Nuevo Lead'} onClose={onClose} wide>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12}}>
      <FInput label="País" value={form.country} onChange={v=>f('country',v)} options={COUNTRIES} required error={errors.country}/>

      <FInput label="Puesto" value={form.puesto} onChange={v=>f('puesto',v)}/>
      <FInput label="Email" value={form.email} onChange={v=>f('email',v)} type="email" error={errors.email}/>
      <FInput label="Teléfono" value={form.phone} onChange={v=>f('phone',v)}/>
      <FInput label="Status" value={form.status} onChange={v=>f('status',v)} options={PIPELINE_STAGES}/>
      {form.status==='Perdido'
        ?<FInput label="Motivo pérdida" value={form.loss_reason} onChange={v=>f('loss_reason',v)} options={LOSS_REASONS}/>
        :<FInput label="Tier" value={form.tier} onChange={v=>f('tier',v)} options={TIERS}/>
      }
      <FInput label="Volumen/mes" value={form.volumen} onChange={v=>f('volumen',v)} type="number" error={errors.volumen}/>
      <FInput label="Revenue Est." value={form.revenue} onChange={v=>f('revenue',v)} type="number"/>
      <FInput label="Margen Est." value={form.margen} onChange={v=>f('margen',v)} type="number"/>
      <FInput label="Tarifa Prom." value={form.tarifa} onChange={v=>f('tarifa',v)} type="number"/>

      <div style={{gridColumn:'1/-1'}}><FInput label="Próximo Paso" value={form.next_step} onChange={v=>f('next_step',v)}/></div>
      <div style={{gridColumn:'1/-1',display:'flex',flexDirection:'column',gap:4}}>
        <label style={{fontSize:11,color:'#94A3B8',textTransform:'uppercase'}}>Comentarios</label>
        <textarea value={form.comments||''} onChange={e=>f('comments',e.target.value)} rows={2} style={{background:'#1E2535',border:'1px solid #2D3748',color:'#E2E8F0',borderRadius:8,padding:'8px 10px',fontSize:13,resize:'vertical',width:'100%',outline:'none',boxSizing:'border-box'}}/>
      </div>
    </div>
    <div style={{display:'flex',justifyContent:'flex-end',gap:10,marginTop:20}}>
      <button onClick={onClose} style={{background:'#1E2535',border:'1px solid #2D3748',color:'#94A3B8',borderRadius:8,padding:'9px 16px',fontSize:13,cursor:'pointer'}}>Cancelar</button>
      <GreenBtn onClick={handleSave} disabled={saving}>{saving?'Guardando...':'Guardar'}</GreenBtn>
    </div>
  </Modal>

// ── ACCOUNT FICHA MODAL ───────────────────────────────────
function AccountFichaModal({account,onClose,profile}){
  const[tab,setTab]=useState('notas')
  const[notas,setNotas]=useState([])
  const[archivos,setArchivos]=useState([])
  const[nuevaNota,setNuevaNota]=useState('')
  const[loadingNotas,setLoadingNotas]=useState(true)
  const[loadingArchivos,setLoadingArchivos]=useState(true)
  const[saving,setSaving]=useState(false)
  const[uploading,setUploading]=useState(false)
  const fileRef=useRef()

  useEffect(()=>{fetchNotas();fetchArchivos()},[account.id])

  async function fetchNotas(){
    setLoadingNotas(true)
    const{data}=await sb.from('account_notes').select('*').eq('account_id',account.id).order('created_at',{ascending:false})
    setNotas(data||[]);setLoadingNotas(false)
  }
  async function fetchArchivos(){
    setLoadingArchivos(true)
    const{data}=await sb.from('account_files').select('*').eq('account_id',account.id).order('created_at',{ascending:false})
    setArchivos(data||[]);setLoadingArchivos(false)
  }
  async function guardarNota(){
    if(!nuevaNota.trim())return
    setSaving(true)
    const{data,error}=await sb.from('account_notes').insert([{account_id:account.id,content:nuevaNota.trim(),created_by:profile?.email||'',created_at:new Date().toISOString()}]).select().single()
    if(!error){setNotas(p=>[data,...p]);setNuevaNota('')}
    setSaving(false)
  }
  async function eliminarNota(id){
    await sb.from('account_notes').delete().eq('id',id)
    setNotas(p=>p.filter(n=>n.id!==id))
  }
  async function subirArchivo(file){
    if(!file)return
    setUploading(true)
    const ext=file.name.split('.').pop()
    const path=`accounts/${account.id}/${Date.now()}.${ext}`
    const{error:upErr}=await sb.storage.from('account-files').upload(path,file)
    if(!upErr){
      const{data:{publicUrl}}=sb.storage.from('account-files').getPublicUrl(path)
      const{data,error}=await sb.from('account_files').insert([{account_id:account.id,name:file.name,url:publicUrl,size:file.size,type:file.type,created_by:profile?.email||'',created_at:new Date().toISOString()}]).select().single()
      if(!error)setArchivos(p=>[data,...p])
    }
    setUploading(false)
  }
  async function eliminarArchivo(arch){
    const path=arch.url.split('/account-files/')[1]
    await sb.storage.from('account-files').remove([path])
    await sb.from('account_files').delete().eq('id',arch.id)
    setArchivos(p=>p.filter(a=>a.id!==arch.id))
  }
  const fmtSize=b=>b>1048576?`${(b/1048576).toFixed(1)} MB`:b>1024?`${(b/1024).toFixed(0)} KB`:`${b} B`
  const fileIcon=t=>t?.includes('pdf')?'📄':t?.includes('image')?'🖼️':t?.includes('sheet')||t?.includes('excel')||t?.includes('csv')?'📊':t?.includes('word')||t?.includes('document')?'📝':'📎'

  return <Modal title={`Ficha — ${account.empresa}`} onClose={onClose} wide subtitle={`${account.country} · ${account.status}`}>
    <div style={{display:'flex',gap:8,marginBottom:18}}>
      {[['notas','📝 Notas internas'],['archivos','📁 Archivos'],['bpm','⚙️ BPM']].map(([id,label])=>(
        <button key={id} onClick={()=>setTab(id)} style={{padding:'6px 14px',borderRadius:20,border:`1px solid ${tab===id?'#5CBB00':'#2D3748'}`,background:tab===id?'#5CBB0022':'transparent',color:tab===id?'#5CBB00':'#64748B',fontSize:12,cursor:'pointer',fontWeight:tab===id?600:400}}>{label}</button>
      ))}
    </div>
    {tab==='notas'&&<div>
      <div style={{display:'flex',gap:10,marginBottom:16}}>

// ── IMPORT MODAL ──────────────────────────────────────────
function ImportModal({onClose,onImport,defaultCountry}){
  const[step,setStep]=useState('upload')
  const[rows,setRows]=useState([])
  const[errors,setErrors]=useState([])
  const[progress,setProgress]=useState(0)
  const HEADER_MAP={'country':'country','país':'country','pais':'country','empresa':'empresa','nombre del contacto':'contacto','contacto':'contacto','puesto del contacto':'puesto','puesto':'puesto','mail del contacto':'email','email':'email','mail':'email','status':'status','estado':'status','tier':'tier','volumen estimado (mensual)':'volumen','volumen estimado':'volumen','volumen':'volumen','tarifa promedio':'tarifa','tarifa':'tarifa','revenue estimado':'revenue','revenue':'revenue','margen estimado':'margen','margen':'margen','expected\nclose date':'expected_close','expected close date':'expected_close','progress to won':'progress_to_won','ultima interacción':'last_interaction','última interacción':'last_interaction','ultima interaccion':'last_interaction','next step':'next_step','proximo paso':'next_step','comments':'comments','comentarios':'comments'}
  function parseCSV(text){
    const lines=text.split('\n').filter(l=>l.trim())
    if(lines.length<2)return
    const headers=lines[0].split(',').map(h=>h.trim().replace(/"/g,''))
    const fieldMap=headers.map(h=>HEADER_MAP[h.toLowerCase()]||null)
    const parsed=[];const errs=[]
    for(let i=1;i<lines.length;i++){
      const cols=lines[i].split(',').map(c=>c.trim().replace(/"/g,''))
      if(cols.every(c=>!c))continue
      const row={country:defaultCountry||'Chile',tier:'Tier 3',status:'Primer Contacto',progress_to_won:10,volumen:0,revenue:0,margen:0,tarifa:0}
      fieldMap.forEach((field,idx)=>{
        if(!field)return
        const val=cols[idx]?.trim()||''
        if(field==='status')row.status=EXCEL_STATUS_MAP[val]||val||'Primer Contacto'
        else if(field==='progress_to_won'){const n=parseFloat(val);row.progress_to_won=isNaN(n)?10:n<=1?Math.round(n*100):Math.round(n)}
        else if(['volumen','revenue','margen','tarifa'].includes(field))row[field]=parseFloat(val)||0
        else row[field]=val
      })
      if(row.volumen)row.tier=tierFromVolumen(row.volumen)
      if(!row.empresa){errs.push(`Fila ${i+1}: Empresa requerida`);continue}
      parsed.push(row)
    }
    setRows(parsed);setErrors(errs);setStep('preview')
  }
  async function handleImport(){
    setStep('importing')
    const batchSize=20;let done=0
    for(let i=0;i<rows.length;i+=batchSize){
      await onImport(rows.slice(i,i+batchSize))
      done+=Math.min(batchSize,rows.length-i)
      setProgress(Math.round((done/rows.length)*100))
    }
    setStep('done')
  }
  const SC={'Primer Contacto':'#3B82F6','Reunión':'#8B5CF6','Propuesta Enviada':'#F59E0B','Propuesta Ganada':'#89D44A','Ganado':'#5CBB00','Perdido':'#EF4444'}
  const statusCounts=rows.reduce((acc,r)=>{acc[r.status]=(acc[r.status]||0)+1;return acc},{})
  return <Modal title="Importar Leads desde CSV" onClose={onClose} wide subtitle="Compatible con el formato del Excel de WYN">
    {step==='upload'&&<div>
      <div style={{border:'2px dashed #2D3748',borderRadius:12,padding:'48px 24px',textAlign:'center'}}>
        <div style={{fontSize:36,marginBottom:14}}>📂</div>
        <div style={{fontSize:15,fontWeight:600,color:'#F1F5F9',marginBottom:8}}>Seleccioná tu archivo CSV</div>
        <input type="file" accept=".csv" onChange={e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=ev=>parseCSV(ev.target.result);r.readAsText(f,'UTF-8')}}} style={{marginTop:12}}/>
      </div>
    </div>}
    {step==='preview'&&<div>
      <div style={{display:'flex',gap:12,marginBottom:20,flexWrap:'wrap'}}>
        <div style={{background:'#5CBB0015',border:'1px solid #5CBB0033',borderRadius:10,padding:'12px 18px',textAlign:'center'}}>
          <div style={{fontSize:28,fontWeight:700,color:'#5CBB00'}}>{rows.length}</div>
          <div style={{fontSize:11,color:'#64748B'}}>leads a importar</div>
        </div>
        {Object.entries(statusCounts).map(([status,count])=><div key={status} style={{background:(SC[status]||'#6B7280')+'15',border:`1px solid ${(SC[status]||'#6B7280')}33`,borderRadius:10,padding:'10px 14px',textAlign:'center'}}>
          <div style={{fontSize:20,fontWeight:700,color:SC[status]||'#6B7280'}}>{count}</div>
          <div style={{fontSize:10,color:'#64748B'}}>{status}</div>
        </div>)}
      </div>
      {errors.length>0&&<div style={{background:'#EF444415',border:'1px solid #EF444433',borderRadius:10,padding:14,marginBottom:16}}>
        <div style={{fontSize:12,fontWeight:600,color:'#EF4444',marginBottom:6}}>⚠️ {errors.length} filas con problemas</div>
        {errors.slice(0,3).map((e,i)=><div key={i} style={{fontSize:11,color:'#F87171'}}>• {e}</div>)}
      </div>}
      <div style={{display:'flex',justifyContent:'space-between',marginTop:16}}>
        <button onClick={()=>{setStep('upload');setRows([]);setErrors([])}} style={{background:'#1E2535',border:'1px solid #2D3748',color:'#94A3B8',borderRadius:8,padding:'9px 16px',fontSize:13,cursor:'pointer'}}>← Volver</button>
        <GreenBtn onClick={handleImport} disabled={rows.length===0}>Importar {rows.length} leads →</GreenBtn>
      </div>
    </div>}
    {step==='importing'&&<div style={{textAlign:'center',padding:'40px 20px'}}>
      <div style={{fontSize:36,marginBottom:16}}>⏳</div>
      <div style={{height:8,background:'#1E2535',borderRadius:4,marginBottom:10}}>
        <div style={{width:`${progress}%`,height:'100%',background:'linear-gradient(90deg,#5CBB00,#4CAF00)',borderRadius:4,transition:'width 0.3s'}}/>
      </div>
      <div style={{fontSize:13,color:'#64748B'}}>{progress}% completado</div>
    </div>}
    {step==='done'&&<div style={{textAlign:'center',padding:'40px 20px'}}>
      <div style={{fontSize:48,marginBottom:16}}>✅</div>
      <div style={{fontSize:18,fontWeight:700,color:'#5CBB00',marginBottom:8}}>{rows.length} leads importados</div>
      <GreenBtn onClick={onClose}>Cerrar y ver leads</GreenBtn>
    </div>}
  </Modal>
}

// ── DASHBOARD ─────────────────────────────────────────────
function DashboardView({leads,accounts,prospects,activities}){
  const[dateFilter,setDateFilter]=useState('all')
  const fl=dateFilter==='all'?leads:leads.filter(l=>{
    const cutoff=new Date();if(dateFilter==='month')cutoff.setDate(1);if(dateFilter==='quarter')cutoff.setMonth(cutoff.getMonth()-3);
    return new Date(l.created_at||l.last_interaction)>=cutoff
  })

  // ✅ FIX: todas las métricas excluyen Perdido
  const flActive = fl.filter(l => l.status !== 'Perdido')
  const activeLeads=flActive.filter(l=>l.status!=='Ganado')
  const propuestasEnviadas=flActive.filter(l=>l.status==='Propuesta Enviada')
  const propuestasGanadas=flActive.filter(l=>l.status==='Propuesta Ganada')
  const ganados=flActive.filter(l=>l.status==='Ganado')
  const perdidos=fl.filter(l=>l.status==='Perdido')

  const conv=flActive.length>0?Math.round((ganados.length/flActive.length)*100):0
  // ✅ FIX: revenue y volumen solo de activos (no perdidos)
  const totalRevenue=flActive.reduce((s,l)=>s+(l.revenue||0),0)
  const totalVolumen=flActive.reduce((s,l)=>s+(l.volumen||0),0)
  const staleCount=leads.filter(l=>isStale(l,activities)).length

  const byStage=PIPELINE_STAGES.filter(s=>s!=='Perdido').map(s=>({stage:s,count:flActive.filter(l=>l.status===s).length}))
  const activeTotal=flActive.length

  const LATAM_TOTAL={
    country:'🌎 LATAM',
    leads:flActive.length,
    ganados:ganados.length,
    revenue:flActive.reduce((a,l)=>a+(l.revenue||0),0),
    volumen:flActive.reduce((a,l)=>a+(l.volumen||0),0)
  }

  // ✅ FIX dashboard country: incluye Regional, excluye Perdido
  const countriesConLeads=[...new Set(flActive.map(l=>l.country).filter(Boolean))].sort()
  const byCountry=countriesConLeads.map(c=>({
    country:c,
    leads:flActive.filter(l=>l.country===c).length,
    ganados:flActive.filter(l=>l.country===c&&l.status==='Ganado').length,
    revenue:flActive.filter(l=>l.country===c).reduce((a,l)=>a+(l.revenue||0),0),
    volumen:flActive.filter(l=>l.country===c).reduce((a,l)=>a+(l.volumen||0),0)
  })).filter(c=>c.leads>0)

  const lossReasons=fl.filter(l=>l.status==='Perdido'&&l.loss_reason).reduce((acc,l)=>{acc[l.loss_reason]=(acc[l.loss_reason]||0)+1;return acc},{})

  return <div style={{display:'flex',flexDirection:'column',gap:18}}>
    <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
      {[['all','Todo el tiempo'],['month','Este mes'],['quarter','Último trimestre']].map(([v,label])=><button key={v} onClick={()=>setDateFilter(v)} style={{padding:'6px 14px',borderRadius:20,border:`1px solid ${dateFilter===v?'#5CBB00':'#2D3748'}`,background:dateFilter===v?'#5CBB0022':'transparent',color:dateFilter===v?'#5CBB00':'#64748B',fontSize:12,cursor:'pointer',fontWeight:dateFilter===v?600:400}}>{label}</button>)}
      {staleCount>0&&<div style={{marginLeft:'auto',background:'#EF444415',border:'1px solid #EF444433',borderRadius:20,padding:'6px 14px',fontSize:12,color:'#EF4444',fontWeight:600}}>🔴 {staleCount} leads sin actividad +7d</div>}
    </div>

    <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
      <StatCard label="Leads Activos" value={activeLeads.length} icon="🎯" color="#3B82F6" sub={`${prospects.length} prospectos`}/>
      <StatCard label="Propuestas Enviadas" value={propuestasEnviadas.length} icon="📤" color="#F59E0B" sub={`${fmtNum(propuestasEnviadas.reduce((s,l)=>s+(l.volumen||0),0))} envíos/mes`}/>
      <StatCard label="Propuestas Aceptadas" value={propuestasGanadas.length} icon="🤝" color="#89D44A" sub={`${fmtNum(propuestasGanadas.reduce((s,l)=>s+(l.volumen||0),0))} envíos/mes`}/>
      <StatCard label="Ganados" value={ganados.length} icon="🏆" color="#5CBB00" sub={`${fmtNum(ganados.reduce((s,l)=>s+(l.volumen||0),0))} envíos/mes`}/>
    </div>

    <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
      <StatCard label="Conversión (sin perdidos)" value={`${conv}%`} icon="📈" color="#F59E0B"/>
      <StatCard label="Revenue Pipeline" value={fmtCur(totalRevenue)} icon="💰" color="#64748B" sub="Excluye perdidos"/>
      <StatCard label="Volumen Total" value={fmtNum(totalVolumen)} icon="📦" color="#007B84" sub="envíos/mes · excluye perdidos"/>
      <StatCard label="Cuentas Activas" value={accounts.filter(a=>a.status==='Activo').length} icon="🏢" color="#5CBB00"/>
    </div>

    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:18}}>
      <Card>
        <div style={{fontSize:12,fontWeight:600,color:'#94A3B8',marginBottom:14}}>Pipeline por Etapa</div>
        {byStage.map(s=><div key={s.stage} style={{display:'flex',alignItems:'center',gap:10,marginBottom:8}}>
          <div style={{width:130,fontSize:11,color:'#94A3B8'}}>{s.stage}</div>
          <div style={{flex:1,background:'#1E2535',borderRadius:4,height:7}}><div style={{width:`${activeTotal>0?(s.count/activeTotal)*100:0}%`,height:'100%',background:stageColor(s.stage),borderRadius:4}}/></div>
          <div style={{width:22,fontSize:12,fontWeight:700,color:'#E2E8F0',textAlign:'right'}}>{s.count}</div>
        </div>)}
      </Card>

      <Card>
        <div style={{fontSize:12,fontWeight:600,color:'#94A3B8',marginBottom:14}}>
          Performance por País <span style={{fontSize:10,color:'#475569',fontWeight:400}}>(excluye perdidos)</span>
        </div>
        <div style={{fontSize:10,display:'grid',gridTemplateColumns:'1fr 36px 50px 72px 70px',color:'#475569',textTransform:'uppercase',paddingBottom:6,borderBottom:'1px solid #1E2535',marginBottom:4}}>
          <div>País</div><div>Leads</div><div>Ganados</div><div>Revenue</div><div>Envíos</div>
        </div>
        <div style={{display:'grid',gridTemplateColumns:'1fr 36px 50px 72px 70px',fontSize:12,padding:'6px 0 6px 6px',borderBottom:'2px solid #2D3748',marginBottom:4,background:'#1A1F2E',borderRadius:6}}>
          <div style={{color:'#F1F5F9',fontWeight:700}}>{LATAM_TOTAL.country}</div>
          <div style={{color:'#3B82F6',fontWeight:700}}>{LATAM_TOTAL.leads}</div>
          <div style={{color:'#5CBB00',fontWeight:700}}>{LATAM_TOTAL.ganados}</div>
          <div style={{color:'#8B5CF6',fontWeight:700,fontSize:10}}>{fmtCur(LATAM_TOTAL.revenue)}</div>
          <div style={{color:'#007B84',fontWeight:700,fontSize:10}}>{fmtNum(LATAM_TOTAL.volumen)}</div>
        </div>
        {byCountry.map(c=><div key={c.country} style={{display:'grid',gridTemplateColumns:'1fr 36px 50px 72px 70px',fontSize:12,padding:'5px 0 5px 6px',borderBottom:'1px solid #1E253540'}}>
          <div style={{color:c.country==='Regional'?'#8B5CF6':'#94A3B8',fontWeight:c.country==='Regional'?600:400}}>{c.country==='Regional'?'🌐 Regional':c.country}</div>
          <div style={{color:'#3B82F6',fontWeight:600}}>{c.leads}</div>
          <div style={{color:'#5CBB00',fontWeight:600}}>{c.ganados}</div>
          <div style={{color:'#8B5CF6',fontWeight:600,fontSize:10}}>{fmtCur(c.revenue)}</div>
          <div style={{color:'#007B84',fontWeight:600,fontSize:10}}>{fmtNum(c.volumen)}</div>
        </div>)}
      </Card>
    </div>

    {Object.keys(lossReasons).length>0&&<Card>
      <div style={{fontSize:12,fontWeight:600,color:'#94A3B8',marginBottom:14}}>Motivos de Pérdida</div>
      <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
        {Object.entries(lossReasons).sort((a,b)=>b[1]-a[1]).map(([reason,count])=><div key={reason} style={{background:'#EF444415',border:'1px solid #EF444433',borderRadius:8,padding:'8px 14px'}}>
          <div style={{fontSize:18,fontWeight:700,color:'#EF4444'}}>{count}</div>
          <div style={{fontSize:11,color:'#94A3B8'}}>{reason}</div>
        </div>)}
      </div>
    </Card>}
  </div>
}

// ── PIPELINE ──────────────────────────────────────────────
function PipelineView({leads,activities,onMoveStage,onSelect,onConfirmLoss}){
  return <div style={{display:'flex',gap:10,overflowX:'auto',paddingBottom:8,height:'calc(100vh - 130px)'}}>
    {PIPELINE_STAGES.map(stage=>{
      const sl=leads.filter(l=>l.status===stage)
      const isEnd=stage==='Ganado'||stage==='Perdido'
      const idx=PIPELINE_STAGES.indexOf(stage)
      return <div key={stage} style={{minWidth:210,flex:'0 0 210px',display:'flex',flexDirection:'column'}}>
        <div style={{padding:'8px 10px',background:stageColor(stage)+'33',border:`1px solid ${stageColor(stage)}55`,borderRadius:'8px 8px 0 0',display:'flex',justifyContent:'space-between'}}>
          <span style={{fontSize:11,fontWeight:700,color:stageColor(stage)}}>{stage}</span>
          <span style={{background:stageColor(stage)+'44',color:stageColor(stage),fontSize:10,fontWeight:700,padding:'1px 7px',borderRadius:20}}>{sl.length}</span>
        </div>
        <div style={{flex:1,background:'#141820',border:'1px solid #1E2535',borderTop:'none',borderRadius:'0 0 8px 8px',padding:6,overflowY:'auto',display:'flex',flexDirection:'column',gap:6}}>
          {sl.map(lead=>{
            const stale=isStale(lead,activities)
            const hasPricing=!!lead.pricing_proposal
            const pricingPending=hasPricing&&(lead.pricing_proposal.approval_status==='Pendiente aprobación regional'||lead.pricing_proposal.approval_status==='Pendiente aprobación Dirección')
            return <div key={lead.id} onClick={()=>onSelect(lead)} style={{background:'#1A1F2E',border:`1px solid ${pricingPending?'#F9731666':stale?'#EF444466':'#2D3748'}`,borderRadius:8,padding:'9px 10px',cursor:'pointer'}}>
              <div style={{fontSize:12,fontWeight:600,color:'#F1F5F9',marginBottom:2}}>{lead.empresa}{stale&&<StaleWarning/>}{pricingPending&&<span title="Propuesta pendiente aprobación" style={{fontSize:12,marginLeft:4}}>🟠</span>}</div>
              <div style={{fontSize:10,color:'#64748B',marginBottom:6}}>{lead.country} · {lead.tier}</div>
              {lead.volumen>0&&<div style={{fontSize:10,color:'#5CBB00',marginBottom:6}}>📦 {fmtNum(lead.volumen)}/mes</div>}
              {hasPricing&&<div style={{fontSize:10,marginBottom:4}}><Badge text={lead.pricing_proposal.approval_status} color={PRICING_STATUS_COLORS[lead.pricing_proposal.approval_status]||'#64748B'}/></div>}
              <div style={{height:3,background:'#2D3748',borderRadius:2,overflow:'hidden',marginBottom:6}}>
                <div style={{width:`${lead.progress_to_won||0}%`,height:'100%',background:progressColor(lead.progress_to_won||0)}}/>
              </div>
              {!isEnd&&<div style={{display:'flex',gap:3,flexWrap:'wrap'}}>
                {idx>0&&<MiniBtn onClick={e=>{e.stopPropagation();onMoveStage(lead,PIPELINE_STAGES[idx-1])}} color="#64748B">←</MiniBtn>}
                <MiniBtn onClick={e=>{e.stopPropagation();onMoveStage(lead,PIPELINE_STAGES[idx+1])}} color="#5CBB00">→</MiniBtn>
                <MiniBtn onClick={e=>{e.stopPropagation();onConfirmLoss(lead)}} color="#EF4444">✗</MiniBtn>
              </div>}
            </div>
          })}
        </div>
      </div>
    })}
  </div>
}

// ── LEADS VIEW ────────────────────────────────────────────
function LeadsView({leads,activities,accounts,onEdit,onActivity,onBPM,onConvert,onConfirmLoss,onDelete,onViewDetail,onPricing}){
  const[filter,setFilter]=useState('')
  const[stageFilter,setStageFilter]=useState('Todos')
  const[staleOnly,setStaleOnly]=useState(false)
  const[confirmDelete,setConfirmDelete]=useState(null)
  const[sortCol,setSortCol]=useState('created_at')
  const[sortDir,setSortDir]=useState('desc')

  function toggleSort(col){
    if(sortCol===col)setSortDir(d=>d==='asc'?'desc':'asc')
    else{setSortCol(col);setSortDir('desc')}
  }

  const filtered=leads.filter(l=>{
    if(staleOnly&&!isStale(l,activities))return false
    if(stageFilter!=='Todos'&&l.status!==stageFilter)return false
    if(filter&&!l.empresa.toLowerCase().includes(filter.toLowerCase())&&!(l.contacto||'').toLowerCase().includes(filter.toLowerCase()))return false
    return true
  }).sort((a,b)=>{
    const av=a[sortCol]||'';const bv=b[sortCol]||''
    return sortDir==='asc'?(av>bv?1:-1):(av<bv?1:-1)
  })

  const staleCount=leads.filter(l=>isStale(l,activities)).length
  const SortIcon=({col})=><span style={{fontSize:9,marginLeft:2,color:sortCol===col?'#5CBB00':'#475569'}}>{sortCol===col?(sortDir==='asc'?'▲':'▼'):'⇅'}</span>

  return <div style={{display:'flex',flexDirection:'column',gap:12}}>
    <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
      <input placeholder="🔍 Buscar empresa o contacto..." value={filter} onChange={e=>setFilter(e.target.value)} style={{flex:1,minWidth:200,background:'#141820',border:'1px solid #1E2535',color:'#E2E8F0',borderRadius:8,padding:'8px 12px',fontSize:13,outline:'none'}}/>
      <select value={stageFilter} onChange={e=>setStageFilter(e.target.value)} style={{background:'#141820',border:'1px solid #1E2535',color:'#E2E8F0',borderRadius:8,padding:'8px 12px',fontSize:13,cursor:'pointer',outline:'none'}}>
        <option value="Todos">Todas las etapas</option>
        {PIPELINE_STAGES.map(s=><option key={s} value={s}>{s}</option>)}
      </select>
      {staleCount>0&&<button onClick={()=>setStaleOnly(!staleOnly)} style={{padding:'8px 14px',borderRadius:8,border:`1px solid ${staleOnly?'#EF4444':'#2D3748'}`,background:staleOnly?'#EF444422':'transparent',color:staleOnly?'#EF4444':'#64748B',fontSize:12,cursor:'pointer'}}>🔴 Sin actividad ({staleCount})</button>}
      <button onClick={()=>exportToCSV(filtered,'wyn-leads.csv')} style={{padding:'8px 14px',borderRadius:8,border:'1px solid #2D3748',background:'transparent',color:'#64748B',fontSize:12,cursor:'pointer'}}>↓ Exportar CSV</button>
    </div>
    <Card style={{padding:0,overflow:'hidden'}}>
      <div style={{overflowX:'auto'}}>
        <table style={{width:'100%',borderCollapse:'collapse'}}>

            <tr style={{borderBottom:'1px solid #1E2535'}}>
              {[['country','País'],['empresa','Empresa'],['contacto','Contacto'],['status','Status'],['tier','Tier'],['volumen','Vol/mes'],['revenue','Revenue'],['progress_to_won','Progress'],['last_interaction','Última Int.']].map(([col,label])=>(
                <th key={col} onClick={()=>toggleSort(col)} style={{padding:'11px 12px',fontSize:10,color:sortCol===col?'#5CBB00':'#64748B',textTransform:'uppercase',letterSpacing:1,textAlign:'left',whiteSpace:'nowrap',background:'#0F1117',cursor:'pointer'}}>
                  {label}<SortIcon col={col}/>
                </th>
              ))}
              <th style={{padding:'11px 12px',fontSize:10,color:'#64748B',textTransform:'uppercase',background:'#0F1117'}}>Propuesta</th>
              <th style={{padding:'11px 12px',fontSize:10,color:'#64748B',textTransform:'uppercase',background:'#0F1117'}}>Acciones</th>
            </tr>
          </thead>
          <tbody>
            {filtered.length===0
              ?<tr><td colSpan={11} style={{padding:40,textAlign:'center',color:'#475569'}}>No hay leads que coincidan</td></tr>
              :filtered.map(lead=>{
                const stale=isStale(lead,activities)
                const actCount=activities.filter(a=>a.lead_id===lead.id).length
                const hasAccount=accounts.find(a=>a.lead_id===lead.id)
                const pricing=lead.pricing_proposal
                const pricingPending=pricing&&(pricing.approval_status==='Pendiente aprobación regional'||pricing.approval_status==='Pendiente aprobación Dirección')
                return <tr key={lead.id} style={{borderBottom:'1px solid #1E253550',background:pricingPending?'#F9731608':'transparent'}}>
                  <td style={{padding:'10px 12px',fontSize:11,color:'#94A3B8'}}>{lead.country}</td>
                  <td style={{padding:'10px 12px',fontSize:13,fontWeight:600,color:'#F1F5F9',whiteSpace:'nowrap',cursor:'pointer'}} onClick={()=>onViewDetail(lead)}>{lead.empresa}{stale&&<StaleWarning/>}</td>
                  <td style={{padding:'10px 12px',fontSize:12,color:'#CBD5E1'}}>{lead.contacto||'—'}</td>
                  <td style={{padding:'10px 12px'}}><Badge text={lead.status} color={stageColor(lead.status)}/></td>
                  <td style={{padding:'10px 12px'}}><Badge text={lead.tier||'—'} color="#64748B"/></td>
                  <td style={{padding:'10px 12px',fontSize:12,color:'#007B84',fontWeight:600}}>{lead.volumen?fmtNum(lead.volumen):'—'}</td>
                  <td style={{padding:'10px 12px',fontSize:12,color:'#8B5CF6',fontWeight:600}}>{lead.revenue?fmtCur(lead.revenue):'—'}</td>
                  <td style={{padding:'10px 12px',minWidth:90}}>
                    <div style={{display:'flex',alignItems:'center',gap:5}}>
                      <div style={{flex:1,height:5,background:'#1E2535',borderRadius:3}}><div style={{width:`${lead.progress_to_won||0}%`,height:'100%',background:progressColor(lead.progress_to_won||0),borderRadius:3}}/></div>
                      <span style={{fontSize:10,color:progressColor(lead.progress_to_won||0),fontWeight:700,minWidth:26}}>{lead.progress_to_won||0}%</span>
                    </div>
                  </td>
                  <td style={{padding:'10px 12px',fontSize:11,color:stale?'#EF4444':'#64748B'}}>{lead.last_interaction||'—'}</td>
                  {/* Pricing column */}
                  <td style={{padding:'10px 12px'}}>
                    {pricing
                      ? <div style={{display:'flex',flexDirection:'column',gap:3}}>
                          <Badge text={`${(pricing.discount_pct||0).toFixed(1)}% desc.`} color={pricing.discount_pct>15?'#EF4444':pricing.discount_pct>5?'#F97316':pricing.discount_pct>0?'#F59E0B':'#5CBB00'}/>
                          <Badge text={pricing.approval_status} color={PRICING_STATUS_COLORS[pricing.approval_status]||'#64748B'}/>
                        </div>
                      : <span style={{fontSize:11,color:'#475569'}}>—</span>
                    }
                  </td>
                  <td style={{padding:'10px 12px'}}>
                    <div style={{display:'flex',gap:3,flexWrap:'wrap'}}>
                      <MiniBtn onClick={()=>onEdit(lead)} color="#3B82F6">✎</MiniBtn>
                      <MiniBtn onClick={()=>onActivity(lead)} color="#F59E0B">+{actCount>0?actCount:''}</MiniBtn>
                      <MiniBtn onClick={()=>onPricing(lead)} color="#F97316">💲</MiniBtn>
                      {lead.status==='Ganado'&&<MiniBtn onClick={()=>onBPM(lead)} color="#5CBB00">BPM</MiniBtn>}
                      {lead.status==='Ganado'&&!hasAccount&&<MiniBtn onClick={()=>onConvert(lead)} color="#5CBB00">→Cta</MiniBtn>}
                      {lead.status!=='Perdido'&&lead.status!=='Ganado'&&<MiniBtn onClick={()=>onConfirmLoss(lead)} color="#EF4444">Perdido</MiniBtn>}
                      <MiniBtn onClick={()=>setConfirmDelete(lead)} color="#64748B">🗑</MiniBtn>
                    </div>
                  </td>
                </tr>
              })
            }
          </tbody>
        </table>
      </div>
    </Card>
    {confirmDelete&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.8)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:2000}}>
      <div style={{background:'#141820',border:'1px solid #EF444444',borderRadius:16,padding:28,width:380,textAlign:'center'}}>
        <div style={{fontSize:32,marginBottom:12}}>🗑️</div>
        <div style={{fontSize:16,fontWeight:700,color:'#F1F5F9',marginBottom:8}}>¿Eliminar lead?</div>
        <div style={{fontSize:13,color:'#94A3B8',marginBottom:22}}>Vas a eliminar <strong style={{color:'#EF4444'}}>{confirmDelete.empresa}</strong>. Esta acción no se puede deshacer.</div>
        <div style={{display:'flex',gap:10,justifyContent:'center'}}>
          <button onClick={()=>setConfirmDelete(null)} style={{background:'#1E2535',border:'1px solid #2D3748',color:'#94A3B8',borderRadius:8,padding:'9px 20px',fontSize:13,cursor:'pointer'}}>Cancelar</button>
          <button onClick={()=>{onDelete(confirmDelete);setConfirmDelete(null)}} style={{background:'#EF4444',color:'white',border:'none',borderRadius:8,padding:'9px 20px',fontSize:13,fontWeight:600,cursor:'pointer'}}>Eliminar</button>
        </div>
      </div>
    </div>}
  </div>
}

// ── ACTIVITIES VIEW ───────────────────────────────────────
function ActivitiesView({activities,leads,onEdit,onToggleDone}){
  const leadIds=new Set(leads.map(l=>l.id))
  const filtered=activities.filter(a=>leadIds.has(a.lead_id))
  const[showDone,setShowDone]=useState(false)
  const today=new Date().toISOString().split('T')[0]
  const pending=filtered.filter(a=>!a.realizada)
  const done=filtered.filter(a=>a.realizada)
  const visible=showDone?filtered:pending
  if(!filtered.length)return <EmptyState icon="📋" title="Sin actividades" sub="Registrá desde la vista de Leads"/>
  return <div style={{display:'flex',flexDirection:'column',gap:12}}>
    <div style={{display:'flex',gap:10,alignItems:'center'}}>
      <span style={{fontSize:13,color:'#94A3B8'}}>{pending.length} pendientes · {done.length} realizadas</span>
      <button onClick={()=>setShowDone(!showDone)} style={{marginLeft:'auto',padding:'6px 14px',borderRadius:8,border:'1px solid #2D3748',background:'transparent',color:'#64748B',fontSize:12,cursor:'pointer'}}>
        {showDone?'Ocultar realizadas':'Ver realizadas'}
      </button>
    </div>
    {visible.map(act=>{
      const lead=leads.find(l=>l.id===act.lead_id)
      const isOverdue=act.fecha_vencimiento&&act.fecha_vencimiento<today&&!act.realizada
      const isDueToday=act.fecha_vencimiento===today&&!act.realizada
      return <Card key={act.id} style={{padding:'12px 16px',opacity:act.realizada?0.6:1,borderColor:isOverdue?'#EF444444':isDueToday?'#F59E0B44':'#1E2535'}}>
        <div style={{display:'flex',alignItems:'flex-start',gap:12}}>
          <div onClick={()=>onToggleDone(act)} style={{width:34,height:34,borderRadius:8,background:act.realizada?'#5CBB0022':(ACTIVITY_COLORS[act.tipo]||'#64748B')+'22',display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,flexShrink:0,cursor:'pointer',border:`2px solid ${act.realizada?'#5CBB00':'transparent'}`}}>
            {act.realizada?'✅':ACTIVITY_ICONS[act.tipo]||'📌'}
          </div>
          <div style={{flex:1}}>
            <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:4,flexWrap:'wrap'}}>
              <Badge text={act.tipo} color={act.realizada?'#5CBB00':ACTIVITY_COLORS[act.tipo]||'#64748B'}/>
              <span style={{fontSize:12,fontWeight:600,color:'#F1F5F9'}}>{lead?.empresa||'—'}</span>
              <span style={{fontSize:11,color:'#64748B'}}>· {act.fecha}{act.ejecutivo?` · ${act.ejecutivo}`:''}</span>
              {isOverdue&&<span style={{fontSize:11,color:'#EF4444',fontWeight:600}}>⚠ Vencida {act.fecha_vencimiento}</span>}
              {isDueToday&&<span style={{fontSize:11,color:'#F59E0B',fontWeight:600}}>🔔 Vence hoy</span>}
            </div>
            {act.descripcion&&<p style={{margin:'0 0 6px',fontSize:12,color:'#94A3B8',lineHeight:1.5}}>{act.descripcion}</p>}
            {act.proximo_paso&&<div style={{background:'#1E2535',borderRadius:6,padding:'6px 10px',fontSize:11,color:'#5CBB00'}}><span style={{color:'#64748B'}}>Próx. paso: </span>{act.proximo_paso}</div>}
          </div>
          <button onClick={()=>onEdit(act,lead)} style={{background:'#1E2535',border:'1px solid #2D3748',color:'#94A3B8',borderRadius:6,padding:'4px 10px',fontSize:11,cursor:'pointer',flexShrink:0}}>✎ Editar</button>
        </div>
      </Card>
    })}
  </div>
}

// ── PRODUCTS VIEW ─────────────────────────────────────────
function ProductModal({product,onClose,onSave}){
  const[form,setForm]=useState(product||{country:'',servicio:'',modalidad:'B2C',tipo_entrega:'Domicilio',tarifa:'',moneda:'USD',sla:'',condiciones:''})
  const[saving,setSaving]=useState(false)
  const f=(k,v)=>setForm(p=>({...p,[k]:v}))
  return <Modal title={product?'Editar Producto':'Nuevo Producto'} onClose={onClose}>
    <div style={{display:'flex',flexDirection:'column',gap:12}}>
      <FInput label="País" value={form.country} onChange={v=>f('country',v)} options={COUNTRIES} required/>
      <FInput label="Nombre del Servicio" value={form.servicio} onChange={v=>f('servicio',v)} required/>
      <FInput label="Modalidad" value={form.modalidad} onChange={v=>f('modalidad',v)} options={MODALITIES}/>
      <FInput label="Tipo de Entrega" value={form.tipo_entrega} onChange={v=>f('tipo_entrega',v)} options={DELIVERY_TYPES}/>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <FInput label="Tarifa" value={form.tarifa} onChange={v=>f('tarifa',v)}/>
        <FInput label="Moneda" value={form.moneda} onChange={v=>f('moneda',v)} options={CURRENCIES}/>
      </div>
      <FInput label="SLA" value={form.sla} onChange={v=>f('sla',v)}/>
      <FInput label="Condiciones" value={form.condiciones} onChange={v=>f('condiciones',v)}/>
    </div>
    <div style={{display:'flex',justifyContent:'flex-end',gap:10,marginTop:18}}>
      <button onClick={onClose} style={{background:'#1E2535',border:'1px solid #2D3748',color:'#94A3B8',borderRadius:8,padding:'9px 16px',fontSize:13,cursor:'pointer'}}>Cancelar</button>
      <GreenBtn onClick={async()=>{if(!form.servicio||!form.country)return;setSaving(true);await onSave(form);setSaving(false);onClose()}} disabled={saving}>Guardar</GreenBtn>
    </div>
  </Modal>
}

// ── IMPORT PROSPECTS MODAL ────────────────────────────────
function ImportProspectsModal({onClose,onImport,defaultCountry}){
  const[step,setStep]=useState('upload')
  const[rows,setRows]=useState([])
  const[progress,setProgress]=useState(0)
  const HEADER_MAP={'country':'country','país':'country','pais':'country','empresa':'empresa','contacto':'contacto','email':'email','mail':'email','volumen estimado':'volumen_estimado','volumen_estimado':'volumen_estimado','volumen':'volumen_estimado','estado':'status','status':'status'}
  function parseCSV(text){
    const lines=text.split('\n').filter(l=>l.trim())
    if(lines.length<2)return
    const headers=lines[0].split(',').map(h=>h.trim().replace(/"/g,''))
    const fieldMap=headers.map(h=>HEADER_MAP[h.toLowerCase()]||null)
    const parsed=[]
    for(let i=1;i<lines.length;i++){
      const cols=lines[i].split(',').map(c=>c.trim().replace(/"/g,''))
      if(cols.every(c=>!c))continue
      const row={country:defaultCountry||'',status:'Sin Contacto',volumen_estimado:0}
      fieldMap.forEach((field,idx)=>{if(!field)return;const val=cols[idx]?.trim()||'';if(field==='volumen_estimado')row[field]=parseFloat(val)||0;else row[field]=val})
      if(!row.empresa)continue
      parsed.push(row)
    }
    setRows(parsed);setStep('preview')
  }
  async function handleImport(){
    setStep('importing');const batchSize=20;let done=0
    for(let i=0;i<rows.length;i+=batchSize){
      await onImport(rows.slice(i,i+batchSize))
      done+=Math.min(batchSize,rows.length-i)
      setProgress(Math.round((done/rows.length)*100))
    }
    setStep('done')
  }
  return <Modal title="Importar Prospectos desde CSV" onClose={onClose} wide>
    {step==='upload'&&<div style={{border:'2px dashed #2D3748',borderRadius:12,padding:'48px 24px',textAlign:'center'}}>
      <div style={{fontSize:36,marginBottom:14}}>📂</div>
      <input type="file" accept=".csv" onChange={e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=ev=>parseCSV(ev.target.result);r.readAsText(f,'UTF-8')}}}/>
    </div>}
    {step==='preview'&&<div>
      <div style={{fontSize:18,fontWeight:700,color:'#5CBB00',marginBottom:16}}>{rows.length} prospectos listos para importar</div>
      <div style={{display:'flex',justifyContent:'space-between'}}>
        <button onClick={()=>{setStep('upload');setRows([])}} style={{background:'#1E2535',border:'1px solid #2D3748',color:'#94A3B8',borderRadius:8,padding:'9px 16px',fontSize:13,cursor:'pointer'}}>← Volver</button>
        <GreenBtn onClick={handleImport}>Importar {rows.length} →</GreenBtn>
      </div>
    </div>}
    {step==='importing'&&<div style={{textAlign:'center',padding:'40px 20px'}}>
      <div style={{height:8,background:'#1E2535',borderRadius:4,marginBottom:10}}><div style={{width:`${progress}%`,height:'100%',background:'#5CBB00',borderRadius:4}}/></div>
      <div style={{fontSize:13,color:'#64748B'}}>{progress}% completado</div>
    </div>}
    {step==='done'&&<div style={{textAlign:'center',padding:'40px 20px'}}>
      <div style={{fontSize:48,marginBottom:16}}>✅</div>
      <GreenBtn onClick={onClose}>Cerrar</GreenBtn>
    </div>}
  </Modal>
}
