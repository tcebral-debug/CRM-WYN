const RETURN_TYPES = ["Logística Inversa","Sin Retorno","Retorno Parcial"]
const BILLING_EVENTS = ["Despacho","Entrega","Mensual","Quincenal"]
const INTEGRATION_TYPES = ["API REST","Shopify","WooCommerce","VTEX","Magento","Manual"]

const ACTIVITY_TYPES = ["Llamada","Email","Reunión","Tarea"]
const LOSS_REASONS = ["Precio","Competidor","Sin respuesta","Timing","Servicio no aplica","Volumen insuficiente","Otro"]
const STAGE_COLORS = {"Primer Contacto":"#3B82F6","Reunión":"#8B5CF6","Propuesta Enviada":"#F59E0B","Re-Propuesta":"#F97316","Ganado":"#10B981","Perdido":"#EF4444"}

const ACTIVITY_COLORS = {"Llamada":"#3B82F6","Email":"#8B5CF6","Reunión":"#10B981","Tarea":"#F59E0B"}
const EXCEL_STATUS_MAP = {'Primer Contacto (Contactado)':'Primer Contacto','Primer Contacto':'Primer Contacto','Reunión (En Proceso / Visitado)':'Reunión','Reunión':'Reunión','Propuesta Enviada':'Propuesta Enviada','Re-Propuesta':'Re-Propuesta','Onboarding':'Ganado','Ganado':'Ganado','Perdido':'Perdido'}
const STALE_DAYS = 7

// ── UTILS ─────────────────────────────────────────────────
const stageColor = s => STAGE_COLORS[s] || '#6B7280'
const fmtNum = n => n != null && n !== '' ? Number(n).toLocaleString('es-AR') : '—'
const fmtCur = n => n ? `$${Number(n).toLocaleString('es-AR')}` : '—'
const progressColor = p => p === 100 ? '#10B981' : p >= 50 ? '#F59E0B' : p > 0 ? '#3B82F6' : '#EF4444'
function tierFromVolumen(vol) {
  const v = parseFloat(vol)||0
  if(v>9999)return'Tier 1';if(v>2500)return'Tier 2';if(v>=500)return'Tier 3';return'Tier 4'
}
function daysSince(d){if(!d)return 999;return Math.floor((Date.now()-new Date(d).getTime())/(86400000))}
function isStale(lead,activities){
  if(lead.status==='Ganado'||lead.status==='Perdido')return false
  const acts=activities.filter(a=>a.lead_id===lead.id)
  if(!acts.length)return daysSince(lead.last_interaction)>STALE_DAYS
  const latest=acts.reduce((a,b)=>new Date(a.fecha)>new Date(b.fecha)?a:b)
  return daysSince(latest.fecha)>STALE_DAYS
}
function validateLead(f){
  const e={}
  if(!f.empresa?.trim())e.empresa='Requerido'
  if(!f.country)e.country='Requerido'
  if(f.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email))e.email='Email inválido'
  if(f.volumen!==''&&f.volumen<0)e.volumen='Positivo'
  if(f.progress_to_won<0||f.progress_to_won>100)e.progress_to_won='0-100'
  return e
}
function exportToCSV(data,filename){
  if(!data.length)return
  const keys=Object.keys(data[0]).filter(k=>!['bpm_tasks','servicio'].includes(k))
  const csv=[keys.join(','),...data.map(r=>keys.map(k=>{const v=r[k]??'';return typeof v==='string'&&v.includes(',')? `"${v}"`:v}).join(','))].join('\n')
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=filename;a.click()
}

// ── AUTH CONTEXT ──────────────────────────────────────────
const AuthContext = createContext({})
function AuthProvider({children}){
  const [user,setUser]=useState(null)
  const [profile,setProfile]=useState(null)
  const [loading,setLoading]=useState(true)
  useEffect(()=>{
    sb.auth.getSession().then(({data:{session}})=>{
      setUser(session?.user??null)
      if(session?.user)fetchProfile(session.user.id)
      else setLoading(false)
    })
    const {data:{subscription}}=sb.auth.onAuthStateChange((_,session)=>{
      setUser(session?.user??null)
      if(session?.user)fetchProfile(session.user.id)
      else{setProfile(null);setLoading(false)}
    })
    return()=>subscription.unsubscribe()
  },[])
  async function fetchProfile(id){
    const{data}=await sb.from('profiles').select('*').eq('id',id).single()
    setProfile(data);setLoading(false)
  }
  async function signIn(email,password){return await sb.auth.signInWithPassword({email,password})}
  async function signOut(){await sb.auth.signOut()}
  const isRegional=profile?.role==='regional'
  const isManager=profile?.role==='manager'||profile?.role==='regional'
  return <AuthContext.Provider value={{user,profile,loading,signIn,signOut,isRegional,isManager,userCountry:profile?.country}}>{children}</AuthContext.Provider>
}
const useAuth=()=>useContext(AuthContext)

function StaleWarning(){return <span title="Sin actividad +7 días" style={{fontSize:12,marginLeft:4}}>🔴</span>}

function FInput({label,value,onChange,type='text',options,error,required,disabled}){
  const base={background:disabled?'#141820':'#1E2535',border:`1px solid ${error?'#EF4444':'#2D3748'}`,color:'#E2E8F0',borderRadius:8,padding:'8px 10px',fontSize:13,width:'100%',outline:'none',boxSizing:'border-box'}
  return <div style={{display:'flex',flexDirection:'column',gap:4}}>
    <label style={{fontSize:11,color:error?'#EF4444':'#94A3B8',textTransform:'uppercase',letterSpacing:0.8}}>{label}{required&&' *'}</label>
    {options
      ?<select value={value||''} onChange={e=>onChange(e.target.value)} style={base} disabled={disabled}>
        <option value=''>Seleccionar...</option>
        {options.map(o=><option key={o} value={o}>{o}</option>)}
      </select>
      :<input type={type} value={value||''} onChange={e=>onChange(e.target.value)} style={base} disabled={disabled}/>
    }
    {error&&<span style={{fontSize:10,color:'#EF4444'}}>{error}</span>}
  </div>
}

  </div>
}

        <div style={{fontSize:24,fontWeight:700,color:'#F1F5F9'}}>WYN CRM</div>
        <div style={{fontSize:13,color:'#475569',marginTop:6}}>Ingresá con tu cuenta corporativa</div>

// ── BPM MODAL ─────────────────────────────────────────────
function BPMModal({entity,onClose,onSave}){
  const[form,setForm]=useState({...entity,bpm_tasks:entity?.bpm_tasks||Object.fromEntries(BPM_TASKS.map(t=>[t,false])),servicio:entity?.servicio||{}})
  const[saving,setSaving]=useState(false)
  const s=form.servicio||{}
  const setS=(k,v)=>setForm(p=>({...p,servicio:{...p.servicio,[k]:v}}))
  const toggleTask=t=>setForm(p=>({...p,bpm_tasks:{...p.bpm_tasks,[t]:!p.bpm_tasks[t]}}))
  const done=Object.values(form.bpm_tasks||{}).filter(Boolean).length
  const pct=Math.round((done/BPM_TASKS.length)*100)
  const SECTIONS=[
    {title:'📋 Definición de Servicio',color:'#10B981',fields:[{l:'Modalidad',k:'modalidad',opts:MODALITIES},{l:'País',k:'pais',opts:COUNTRIES},{l:'Tipo Entrega',k:'tipo_entrega',opts:DELIVERY_TYPES},{l:'Cash on Delivery',k:'cash_on_delivery',opts:['Sí','No']},{l:'Observaciones',k:'observaciones',wide:true},{l:'Fecha Requerimiento',k:'fecha_requerimiento',type:'date'}]},
    {title:'🔌 Integración',color:'#8B5CF6',fields:[{l:'Tipo',k:'integracion',opts:INTEGRATION_TYPES},{l:'Moneda',k:'moneda',opts:CURRENCIES},{l:'Etiqueta',k:'etiqueta'},{l:'Tracking Number',k:'tracking_number'},{l:'Obligaciones',k:'obligaciones',wide:true},{l:'Eventos Mandatorios',k:'eventos_mandatorios',wide:true}]},
    {title:'⚙️ Operativo',color:'#F59E0B',fields:[{l:'Cut Off',k:'cut_off'},{l:'Intentos',k:'intentos_entrega',type:'number'},{l:'Retornos',k:'retornos',opts:RETURN_TYPES},{l:'Cobertura',k:'cobertura'},{l:'Prealerta',k:'prealerta'},{l:'Comentarios',k:'comentarios_op',wide:true}]},
    {title:'🧾 Facturación',color:'#06B6D4',fields:[{l:'Modalidad',k:'modalidad_fact',opts:MODALITIES},{l:'Evento Facturador',k:'billing_event',opts:BILLING_EVENTS},{l:'Período',k:'periodo'}]}
  ]
  return <Modal title={`BPM — ${entity?.empresa}`} onClose={onClose} wide>
    <div style={{display:'grid',gridTemplateColumns:'220px 1fr',gap:22}}>
      <div>
        <div style={{fontSize:11,color:'#64748B',textTransform:'uppercase',letterSpacing:1,marginBottom:12}}>Tracking</div>
        <div style={{marginBottom:14}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
            <span style={{fontSize:11,color:'#64748B'}}>Progreso</span>
            <span style={{fontSize:12,fontWeight:700,color:pct===100?'#10B981':'#F59E0B'}}>{pct}%</span>
          </div>
          <div style={{height:7,background:'#1E2535',borderRadius:4}}>
            <div style={{width:`${pct}%`,height:'100%',background:pct===100?'#10B981':'linear-gradient(90deg,#F59E0B,#10B981)',borderRadius:4,transition:'width 0.3s'}}/>
          </div>
        </div>
        {BPM_TASKS.map(t=><div key={t} onClick={()=>toggleTask(t)} style={{display:'flex',alignItems:'center',gap:10,padding:'9px 10px',background:form.bpm_tasks[t]?'#10B98115':'#141820',border:`1px solid ${form.bpm_tasks[t]?'#10B981':'#1E2535'}`,borderRadius:8,cursor:'pointer',marginBottom:5}}>
          <div style={{width:18,height:18,borderRadius:4,border:`2px solid ${form.bpm_tasks[t]?'#10B981':'#475569'}`,background:form.bpm_tasks[t]?'#10B981':'transparent',display:'flex',alignItems:'center',justifyContent:'center',fontSize:10,color:'white',flexShrink:0}}>{form.bpm_tasks[t]?'✓':''}</div>
          <span style={{fontSize:12,color:form.bpm_tasks[t]?'#10B981':'#94A3B8',fontWeight:form.bpm_tasks[t]?600:400}}>{t}</span>
        </div>)}
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:14,overflowY:'auto',maxHeight:'65vh'}}>
        {SECTIONS.map(section=><div key={section.title} style={{background:'#1A2235',border:'1px solid #1E2D42',borderRadius:10,padding:14}}>
          <div style={{fontSize:12,fontWeight:700,color:section.color,marginBottom:12}}>{section.title}</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
            {section.fields.map(field=><div key={field.k} style={field.wide?{gridColumn:'1/-1'}:{}}>
              <FInput label={field.l} value={s[field.k]||''} onChange={v=>setS(field.k,v)} options={field.opts} type={field.type||'text'}/>
            </div>)}
          </div>
        </div>)}
      </div>
    </div>
    <div style={{display:'flex',justifyContent:'flex-end',gap:10,marginTop:20}}>
      <button onClick={onClose} style={{background:'#1E2535',border:'1px solid #2D3748',color:'#94A3B8',borderRadius:8,padding:'9px 16px',fontSize:13,cursor:'pointer'}}>Cancelar</button>
      <GreenBtn onClick={async()=>{setSaving(true);await onSave(form);setSaving(false)}} disabled={saving}>{saving?'Guardando...':'Guardar BPM'}</GreenBtn>
    </div>
  </Modal>
}

// ── LEAD MODAL ────────────────────────────────────────────
function LeadModal({lead,onClose,onSave,defaultCountry}){
  const[form,setForm]=useState(lead||{country:defaultCountry||'',empresa:'',contacto:'',puesto:'',email:'',phone:'',status:'Primer Contacto',tier:'Tier 3',volumen:'',revenue:'',margen:'',tarifa:'',expected_close:'',progress_to_won:10,last_interaction:'',next_step:'',comments:'',loss_reason:''})
  const[errors,setErrors]=useState({})
  const[saving,setSaving]=useState(false)
  const f=(k,v)=>{
    const u={...form,[k]:v}
    if(k==='volumen'&&v)u.tier=tierFromVolumen(v)
    setForm(u)
    if(errors[k])setErrors(p=>{const e={...p};delete e[k];return e})
  }
  async function handleSave(){
    const errs=validateLead(form)
    if(Object.keys(errs).length){setErrors(errs);return}
    setSaving(true);await onSave(form);setSaving(false)
  }
  return <Modal title={lead?`Editar — ${lead.empresa}`:'Nuevo Lead'} onClose={onClose} wide>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12}}>
      <FInput label="País" value={form.country} onChange={v=>f('country',v)} options={COUNTRIES} required error={errors.country}/>
      <FInput label="Empresa" value={form.empresa} onChange={v=>f('empresa',v)} required error={errors.empresa}/>
      <FInput label="Contacto" value={form.contacto} onChange={v=>f('contacto',v)}/>
      <FInput label="Puesto" value={form.puesto} onChange={v=>f('puesto',v)}/>
      <FInput label="Email" value={form.email} onChange={v=>f('email',v)} type="email" error={errors.email}/>
      <FInput label="Teléfono" value={form.phone} onChange={v=>f('phone',v)}/>
      <FInput label="Status" value={form.status} onChange={v=>f('status',v)} options={PIPELINE_STAGES}/>
      {form.status==='Perdido'
        ?<FInput label="Motivo pérdida" value={form.loss_reason} onChange={v=>f('loss_reason',v)} options={LOSS_REASONS}/>
        :<FInput label="Tier" value={form.tier} onChange={v=>f('tier',v)} options={TIERS}/>
      }
      <FInput label="Volumen/mes" value={form.volumen} onChange={v=>f('volumen',v)} type="number" error={errors.volumen}/>
      <FInput label="Revenue Est." value={form.revenue} onChange={v=>f('revenue',v)} type="number"/>
      <FInput label="Margen Est." value={form.margen} onChange={v=>f('margen',v)} type="number"/>
      <FInput label="Tarifa Prom." value={form.tarifa} onChange={v=>f('tarifa',v)} type="number"/>
      <FInput label="Expected Close" value={form.expected_close} onChange={v=>f('expected_close',v)} type="date"/>

// ── IMPORT MODAL ──────────────────────────────────────────
function ImportModal({onClose,onImport,defaultCountry}){
  const[step,setStep]=useState('upload')
  const[rows,setRows]=useState([])
  const[errors,setErrors]=useState([])
  const[progress,setProgress]=useState(0)

  const HEADER_MAP={'country':'country','país':'country','pais':'country','empresa':'empresa','nombre del contacto':'contacto','contacto':'contacto','puesto del contacto':'puesto','puesto':'puesto','mail del contacto':'email','email':'email','mail':'email','status':'status','estado':'status','tier':'tier','volumen estimado (mensual)':'volumen','volumen estimado':'volumen','volumen':'volumen','tarifa promedio':'tarifa','tarifa':'tarifa','revenue estimado':'revenue','revenue':'revenue','margen estimado':'margen','margen':'margen','expected\nclose date':'expected_close','expected close date':'expected_close','progress to won':'progress_to_won','ultima interacción':'last_interaction','última interacción':'last_interaction','ultima interaccion':'last_interaction','next step':'next_step','proximo paso':'next_step','comments':'comments','comentarios':'comments'}

  function parseCSV(text){
    const lines=text.split('\n').filter(l=>l.trim())
    if(lines.length<2)return
    const headers=lines[0].split(',').map(h=>h.trim().replace(/"/g,''))
    const fieldMap=headers.map(h=>HEADER_MAP[h.toLowerCase()]||null)
    const parsed=[];const errs=[]
    for(let i=1;i<lines.length;i++){
      const cols=lines[i].split(',').map(c=>c.trim().replace(/"/g,''))
      if(cols.every(c=>!c))continue
      const row={country:defaultCountry||'Chile',tier:'Tier 3',status:'Primer Contacto',progress_to_won:10,volumen:0,revenue:0,margen:0,tarifa:0}
      fieldMap.forEach((field,idx)=>{
        if(!field)return
        const val=cols[idx]?.trim()||''
        if(field==='status')row.status=EXCEL_STATUS_MAP[val]||val||'Primer Contacto'
        else if(field==='progress_to_won'){const n=parseFloat(val);row.progress_to_won=isNaN(n)?10:n<=1?Math.round(n*100):Math.round(n)}
        else if(['volumen','revenue','margen','tarifa'].includes(field))row[field]=parseFloat(val)||0
        else row[field]=val
      })
      if(row.volumen)row.tier=tierFromVolumen(row.volumen)
      if(!row.empresa){errs.push(`Fila ${i+1}: Empresa requerida`);continue}
      parsed.push(row)
    }
    setRows(parsed);setErrors(errs);setStep('preview')
  }

  async function handleImport(){
    setStep('importing')
    const batchSize=20
    let done=0
    for(let i=0;i<rows.length;i+=batchSize){
      await onImport(rows.slice(i,i+batchSize))
      done+=Math.min(batchSize,rows.length-i)
      setProgress(Math.round((done/rows.length)*100))
    }
    setStep('done')
  }

  const SC={'Primer Contacto':'#3B82F6','Reunión':'#8B5CF6','Propuesta Enviada':'#F59E0B','Ganado':'#10B981','Perdido':'#EF4444'}
  const statusCounts=rows.reduce((acc,r)=>{acc[r.status]=(acc[r.status]||0)+1;return acc},{})

  return <Modal title="Importar Leads desde CSV" onClose={onClose} wide subtitle="Compatible con el formato del Excel de WYN">
    {step==='upload'&&<div>
      <div style={{border:'2px dashed #2D3748',borderRadius:12,padding:'48px 24px',textAlign:'center'}}>
        <div style={{fontSize:36,marginBottom:14}}>📂</div>
        <div style={{fontSize:15,fontWeight:600,color:'#F1F5F9',marginBottom:8}}>Seleccioná tu archivo CSV</div>
        <input type="file" accept=".csv" onChange={e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=ev=>parseCSV(ev.target.result);r.readAsText(f,'UTF-8')}}} style={{marginTop:12}}/>
      </div>
      <div style={{marginTop:16,background:'#1A2235',borderRadius:10,padding:14,fontSize:12,color:'#64748B'}}>
        <strong style={{color:'#94A3B8'}}>Cómo exportar desde Excel:</strong> Archivo → Guardar como → CSV UTF-8
      </div>
    </div>}
    {step==='preview'&&<div>
      <div style={{display:'flex',gap:12,marginBottom:20,flexWrap:'wrap'}}>
        <div style={{background:'#10B98115',border:'1px solid #10B98133',borderRadius:10,padding:'12px 18px',textAlign:'center'}}>
          <div style={{fontSize:28,fontWeight:700,color:'#10B981'}}>{rows.length}</div>
          <div style={{fontSize:11,color:'#64748B'}}>leads a importar</div>
        </div>
        {Object.entries(statusCounts).map(([status,count])=><div key={status} style={{background:(SC[status]||'#6B7280')+'15',border:`1px solid ${(SC[status]||'#6B7280')}33`,borderRadius:10,padding:'10px 14px',textAlign:'center'}}>
          <div style={{fontSize:20,fontWeight:700,color:SC[status]||'#6B7280'}}>{count}</div>
          <div style={{fontSize:10,color:'#64748B'}}>{status}</div>
        </div>)}
      </div>
      {errors.length>0&&<div style={{background:'#EF444415',border:'1px solid #EF444433',borderRadius:10,padding:14,marginBottom:16}}>
        <div style={{fontSize:12,fontWeight:600,color:'#EF4444',marginBottom:6}}>⚠️ {errors.length} filas con problemas</div>
        {errors.slice(0,3).map((e,i)=><div key={i} style={{fontSize:11,color:'#F87171'}}>• {e}</div>)}
      </div>}
      <div style={{display:'flex',justifyContent:'space-between',marginTop:16}}>
        <button onClick={()=>{setStep('upload');setRows([]);setErrors([])}} style={{background:'#1E2535',border:'1px solid #2D3748',color:'#94A3B8',borderRadius:8,padding:'9px 16px',fontSize:13,cursor:'pointer'}}>← Volver</button>
        <GreenBtn onClick={handleImport} disabled={rows.length===0}>Importar {rows.length} leads →</GreenBtn>
      </div>
    </div>}
    {step==='importing'&&<div style={{textAlign:'center',padding:'40px 20px'}}>
      <div style={{fontSize:36,marginBottom:16}}>⏳</div>
      <div style={{height:8,background:'#1E2535',borderRadius:4,marginBottom:10}}>
        <div style={{width:`${progress}%`,height:'100%',background:'linear-gradient(90deg,#10B981,#059669)',borderRadius:4,transition:'width 0.3s'}}/>
      </div>
      <div style={{fontSize:13,color:'#64748B'}}>{progress}% completado</div>
    </div>}
    {step==='done'&&<div style={{textAlign:'center',padding:'40px 20px'}}>
      <div style={{fontSize:48,marginBottom:16}}>✅</div>
      <div style={{fontSize:18,fontWeight:700,color:'#10B981',marginBottom:8}}>{rows.length} leads importados</div>
      <GreenBtn onClick={onClose}>Cerrar y ver leads</GreenBtn>
    </div>}
  </Modal>
}

// ── MAIN APP ──────────────────────────────────────────────
const NAV=[{id:'dashboard',icon:'📊',label:'Dashboard'},{id:'pipeline',icon:'🔀',label:'Pipeline'},{id:'leads',icon:'🎯',label:'Leads'},{id:'prospects',icon:'🔍',label:'Prospectos'},{id:'accounts',icon:'🏢',label:'Cuentas'},{id:'activities',icon:'📋',label:'Actividades'},{id:'products',icon:'📦',label:'Productos & Tarifas'},{id:'reports',icon:'📈',label:'Reportes'}]

function CRMApp(){
  const{profile,signOut,isRegional,userCountry}=useAuth()
  const[view,setView]=useState('dashboard')
  const[selectedCountry,setSelectedCountry]=useState('Regional')
  const[leads,setLeads]=useState([])
  const[prospects,setProspects]=useState([])
  const[accounts,setAccounts]=useState([])
  const[activities,setActivities]=useState([])
  const[products,setProducts]=useState([])
  const[loading,setLoading]=useState(true)
  const[error,setError]=useState(null)
  const[editLead,setEditLead]=useState(null)
  const[showLeadModal,setShowLeadModal]=useState(false)
  const[editProspect,setEditProspect]=useState(null)
  const[showProspectModal,setShowProspectModal]=useState(false)
  const[bpmEntity,setBpmEntity]=useState(null)
  const[activityLead,setActivityLead]=useState(null)
  const[lossLead,setLossLead]=useState(null)
  const[showImport,setShowImport]=useState(false)
  const[sidebarCollapsed,setSidebarCollapsed]=useState(false)
  const[toast,setToast]=useState(null)

  const showToast=(msg,type='success')=>{setToast({msg,type});setTimeout(()=>setToast(null),3500)}
  const effectiveCountry=isRegional?selectedCountry:userCountry
  const countryFilter=useCallback(items=>effectiveCountry==='Regional'?items:items.filter(i=>i.country===effectiveCountry),[effectiveCountry])

  const fetchAll=useCallback(async()=>{
    setLoading(true);setError(null)
    try{
      const country=isRegional?null:userCountry
      let lQ=sb.from('leads').select('*').order('created_at',{ascending:false})
      let pQ=sb.from('prospects').select('*').order('created_at',{ascending:false})
      let aQ=sb.from('accounts').select('*').order('created_at',{ascending:false})
      let prQ=sb.from('products').select('*').order('country')
      if(country){lQ=lQ.eq('country',country);pQ=pQ.eq('country',country);aQ=aQ.eq('country',country);prQ=prQ.eq('country',country)}
      const[l,p,a,act,prod]=await Promise.all([lQ,pQ,aQ,sb.from('activities').select('*').order('fecha',{ascending:false}),prQ])
      if(l.error)throw l.error
      setLeads(l.data||[]);setProspects(p.data||[]);setAccounts(a.data||[]);setActivities(act.data||[]);setProducts(prod.data||[])
    }catch(e){setError('Error al cargar datos. Verificá tu conexión.')}
    setLoading(false)
  },[isRegional,userCountry])

  useEffect(()=>{fetchAll()},[fetchAll])

  async function saveLead(data){
    const now=new Date().toISOString()
    if(data.id){
      const prev=leads.find(l=>l.id===data.id)
      let history=prev?.stage_history||[]
      if(prev&&prev.status!==data.status)history=[...history,{from:prev.status,to:data.status,at:now,by:profile?.email||'',loss_reason:data.loss_reason||null}]
      const{error}=await sb.from('leads').update({...data,stage_history:history}).eq('id',data.id)
      if(error){showToast('Error al guardar','error');return}
      setLeads(prev=>prev.map(l=>l.id===data.id?{...data,stage_history:history}:l))
      showToast('Lead actualizado ✅')
    }else{
      const{data:newLead,error}=await sb.from('leads').insert([{...data,created_at:now,created_by:profile?.id}]).select().single()
      if(error){showToast('Error al crear lead','error');return}
      setLeads(prev=>[newLead,...prev])
      showToast('Lead creado ✅')
    }
    setShowLeadModal(false);setEditLead(null)
  }

  async function moveLead(lead,newStatus){
    const now=new Date().toISOString()
    const history=[...(lead.stage_history||[]),{from:lead.status,to:newStatus,at:now,by:profile?.email||''}]
    const{error}=await sb.from('leads').update({status:newStatus,stage_history:history,progress_to_won:newStatus==='Ganado'?100:newStatus==='Perdido'?0:lead.progress_to_won}).eq('id',lead.id)
    if(!error){setLeads(prev=>prev.map(l=>l.id===lead.id?{...l,status:newStatus,stage_history:history}:l));showToast(`${lead.empresa} → ${newStatus}`)}
  }

  async function confirmLoss(lead,reason){
    const now=new Date().toISOString()
    const history=[...(lead.stage_history||[]),{from:lead.status,to:'Perdido',at:now,by:profile?.email||'',loss_reason:reason}]
    const{error}=await sb.from('leads').update({status:'Perdido',loss_reason:reason,progress_to_won:0,stage_history:history}).eq('id',lead.id)
    if(!error){setLeads(prev=>prev.map(l=>l.id===lead.id?{...l,status:'Perdido',loss_reason:reason,stage_history:history}:l));showToast(`${lead.empresa} marcado como Perdido`)}
    setLossLead(null)
  }

  async function saveProspect(data){
    if(data.id){
      const{error}=await sb.from('prospects').update(data).eq('id',data.id)
      if(!error){setProspects(prev=>prev.map(p=>p.id===data.id?data:p));showToast('Prospecto actualizado ✅')}
    }else{
      const{data:np,error}=await sb.from('prospects').insert([{...data,created_at:new Date().toISOString()}]).select().single()
      if(!error){setProspects(prev=>[np,...prev]);showToast('Prospecto creado ✅')}
    }
    setShowProspectModal(false);setEditProspect(null)
  }

  async function convertProspectToLead(p){
    const{data:lead,error}=await sb.from('leads').insert([{country:p.country,empresa:p.empresa,contacto:p.contacto,puesto:p.puesto,email:p.email,status:'Primer Contacto',tier:tierFromVolumen(p.volumen_estimado),volumen:p.volumen_estimado||0,revenue:0,margen:0,progress_to_won:10,created_at:new Date().toISOString(),created_by:profile?.id}]).select().single()
    if(!error){
      setLeads(prev=>[lead,...prev])
      await sb.from('prospects').delete().eq('id',p.id)
      setProspects(prev=>prev.filter(x=>x.id!==p.id))
      showToast(`${p.empresa} → Lead ✅`)
    }
  }

  async function saveActivity(data){
    const{data:act,error}=await sb.from('activities').insert([{...data,created_by:profile?.id}]).select().single()
    if(!error){
      setActivities(prev=>[act,...prev])
      await sb.from('leads').update({last_interaction:data.fecha}).eq('id',data.lead_id)
      setLeads(prev=>prev.map(l=>l.id===data.lead_id?{...l,last_interaction:data.fecha}:l))
      showToast('Actividad registrada ✅')
    }
    setActivityLead(null)
  }

  async function saveBPM(data){
    const table=accounts.find(a=>a.id===data.id)?'accounts':'leads'
    const{error}=await sb.from(table).update({bpm_tasks:data.bpm_tasks,servicio:data.servicio}).eq('id',data.id)
    if(!error){
      if(table==='accounts')setAccounts(prev=>prev.map(a=>a.id===data.id?{...a,bpm_tasks:data.bpm_tasks,servicio:data.servicio}:a))
      else setLeads(prev=>prev.map(l=>l.id===data.id?{...l,bpm_tasks:data.bpm_tasks,servicio:data.servicio}:l))
      showToast('BPM guardado ✅')
    }
    setBpmEntity(null)
  }

  async function convertToAccount(lead){
    if(accounts.find(a=>a.lead_id===lead.id)){showToast('Ya existe como cuenta','error');return}
    const{data:acc,error}=await sb.from('accounts').insert([{country:lead.country,empresa:lead.empresa,contacto:lead.contacto,email:lead.email,phone:lead.phone,volumen_actual:lead.volumen,revenue_actual:lead.revenue,margen_actual:lead.margen,status:'Activo',lead_id:lead.id,bpm_tasks:Object.fromEntries(BPM_TASKS.map(t=>[t,false])),servicio:{},created_at:new Date().toISOString()}]).select().single()
    if(!error){setAccounts(prev=>[acc,...prev]);showToast(`${lead.empresa} → Cuenta Activa ✅`)}
  }

  async function handleImport(batch){
    const rows=batch.map(r=>({...r,created_at:new Date().toISOString(),created_by:profile?.id}))
    const{error}=await sb.from('leads').insert(rows)
    if(error){showToast('Error en importación','error');return}
    await fetchAll()
  }

  const fLeads=countryFilter(leads)
  const fProspects=countryFilter(prospects)
  const fAccounts=countryFilter(accounts)
  const fProducts=countryFilter(products)

  return <div style={{display:'flex',height:'100vh',overflow:'hidden',fontFamily:"'DM Sans',sans-serif",background:'#0F1117',color:'#E2E8F0'}}>
    {/* SIDEBAR */}
    <aside style={{width:sidebarCollapsed?60:216,background:'#0A0D14',borderRight:'1px solid #1E2535',display:'flex',flexDirection:'column',transition:'width 0.2s',flexShrink:0,overflow:'hidden'}}>
      <div style={{padding:'16px 12px 10px',borderBottom:'1px solid #1E2535',display:'flex',alignItems:'center',gap:8}}>
        <div style={{width:30,height:30,background:'linear-gradient(135deg,#10B981,#059669)',borderRadius:7,display:'flex',alignItems:'center',justifyContent:'center',fontSize:13,fontWeight:800,color:'white',flexShrink:0}}>W</div>
        {!sidebarCollapsed&&<span style={{fontSize:14,fontWeight:700,color:'#F1F5F9',whiteSpace:'nowrap'}}>WYN CRM</span>}
      </div>
      {!sidebarCollapsed&&<div style={{padding:'10px 10px 6px'}}>
        {isRegional
          ?<select value={selectedCountry} onChange={e=>setSelectedCountry(e.target.value)} style={{width:'100%',background:'#1E2535',border:'1px solid #2D3748',color:'#E2E8F0',borderRadius:7,padding:'6px 8px',fontSize:11,cursor:'pointer',outline:'none'}}>
            <option value="Regional">🌎 Regional</option>
            {COUNTRIES.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          :<div style={{background:'#10B98122',border:'1px solid #10B98144',borderRadius:7,padding:'6px 10px',fontSize:11,color:'#10B981',fontWeight:600}}>📍 {userCountry}</div>
        }
      </div>}
      <nav style={{flex:1,padding:'6px',display:'flex',flexDirection:'column',gap:1,overflowY:'auto'}}>
        {NAV.map(item=><button key={item.id} onClick={()=>setView(item.id)} style={{display:'flex',alignItems:'center',gap:9,padding:'8px 8px',borderRadius:7,border:'none',cursor:'pointer',background:view===item.id?'rgba(16,185,129,0.18)':'transparent',color:view===item.id?'#10B981':'#94A3B8',fontSize:12,fontWeight:view===item.id?600:400,textAlign:'left',borderLeft:`2px solid ${view===item.id?'#10B981':'transparent'}`,whiteSpace:'nowrap'}}>
          <span style={{fontSize:14,flexShrink:0}}>{item.icon}</span>
          {!sidebarCollapsed&&<span>{item.label}</span>}
        </button>)}
      </nav>
      {!sidebarCollapsed&&<div style={{padding:10,borderTop:'1px solid #1E2535'}}>
        <div style={{fontSize:11,color:'#64748B',marginBottom:5,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{profile?.email}</div>
        <div style={{marginBottom:8}}><Badge text={profile?.role==='regional'?'Regional':profile?.role==='manager'?'Manager':'Ejecutivo'} color={profile?.role==='regional'?'#8B5CF6':profile?.role==='manager'?'#F59E0B':'#3B82F6'}/></div>
        <button onClick={signOut} style={{width:'100%',background:'#1E2535',border:'1px solid #2D3748',color:'#94A3B8',borderRadius:7,padding:7,fontSize:11,cursor:'pointer'}}>Cerrar sesión</button>
      </div>}
      <button onClick={()=>setSidebarCollapsed(!sidebarCollapsed)} style={{margin:8,padding:7,background:'#1E2535',border:'1px solid #2D3748',borderRadius:7,color:'#64748B',cursor:'pointer',fontSize:11}}>{sidebarCollapsed?'→':'← Colapsar'}</button>
    </aside>

    {/* MAIN */}
    <main style={{flex:1,overflow:'auto',display:'flex',flexDirection:'column'}}>
      <div style={{padding:'14px 22px',borderBottom:'1px solid #1E2535',display:'flex',alignItems:'center',justifyContent:'space-between',background:'#0A0D14',position:'sticky',top:0,zIndex:10,flexShrink:0}}>
        <div>
          <h1 style={{margin:0,fontSize:16,fontWeight:700,color:'#F1F5F9'}}>{NAV.find(n=>n.id===view)?.icon} {NAV.find(n=>n.id===view)?.label}</h1>
          <p style={{margin:0,fontSize:11,color:'#64748B'}}>{effectiveCountry==='Regional'?'Vista Regional':'País: '+effectiveCountry}</p>
        </div>
        <div style={{display:'flex',gap:8}}>
          {(view==='leads'||view==='pipeline')&&<>
            <button onClick={()=>setShowImport(true)} style={{padding:'8px 14px',borderRadius:8,border:'1px solid #2D3748',background:'transparent',color:'#94A3B8',fontSize:12,cursor:'pointer'}}>↑ Importar CSV</button>
            <GreenBtn onClick={()=>{setEditLead(null);setShowLeadModal(true)}}>+ Nuevo Lead</GreenBtn>
          </>}
          {view==='prospects'&&<GreenBtn onClick={()=>{setEditProspect(null);setShowProspectModal(true)}}>+ Nuevo Prospecto</GreenBtn>}
        </div>
      </div>
      <div style={{padding:'20px 22px',flex:1}}>
        {error&&<div style={{background:'#EF444415',border:'1px solid #EF444440',borderRadius:10,padding:'14px 18px',marginBottom:18,fontSize:13,color:'#EF4444',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span>⚠️ {error}</span>
          <button onClick={fetchAll} style={{background:'#EF444422',border:'1px solid #EF444444',color:'#EF4444',borderRadius:6,padding:'4px 12px',fontSize:12,cursor:'pointer'}}>Reintentar</button>
        </div>}
        {loading?<Loader/>:<>
          {view==='dashboard'&&<DashboardView leads={fLeads} accounts={fAccounts} prospects={fProspects} activities={activities}/>}
          {view==='pipeline'&&<PipelineView leads={fLeads} activities={activities} onMoveStage={moveLead} onSelect={l=>{setEditLead(l);setShowLeadModal(true)}} onConfirmLoss={setLossLead}/>}
          {view==='leads'&&<LeadsView leads={fLeads} activities={activities} accounts={fAccounts} onEdit={l=>{setEditLead(l);setShowLeadModal(true)}} onActivity={l=>setActivityLead(l)} onBPM={l=>setBpmEntity(l)} onConvert={convertToAccount} onConfirmLoss={setLossLead}/>}
          {view==='prospects'&&<ProspectsView prospects={fProspects} onEdit={p=>{setEditProspect(p);setShowProspectModal(true)}} onConvert={convertProspectToLead}/>}
          {view==='accounts'&&<AccountsView accounts={fAccounts} onBPM={setBpmEntity}/>}
          {view==='activities'&&<ActivitiesView activities={activities} leads={leads}/>}
          {view==='products'&&<ProductsView products={fProducts}/>}
          {view==='reports'&&<ReportsView leads={fLeads} accounts={fAccounts}/>}
        </>}
      </div>
    </main>

    {showLeadModal&&<LeadModal lead={editLead} onClose={()=>{setShowLeadModal(false);setEditLead(null)}} onSave={saveLead} defaultCountry={!isRegional?userCountry:undefined}/>}
    {showProspectModal&&<ProspectModal prospect={editProspect} onClose={()=>{setShowProspectModal(false);setEditProspect(null)}} onSave={saveProspect} defaultCountry={!isRegional?userCountry:undefined}/>}
    {bpmEntity&&<BPMModal entity={bpmEntity} onClose={()=>setBpmEntity(null)} onSave={saveBPM}/>}
    {activityLead&&<ActivityModal lead={activityLead} onClose={()=>setActivityLead(null)} onSave={saveActivity}/>}
    {lossLead&&<LossModal lead={lossLead} onClose={()=>setLossLead(null)} onConfirm={reason=>confirmLoss(lossLead,reason)}/>}
    {showImport&&<ImportModal onClose={()=>{setShowImport(false);fetchAll()}} onImport={handleImport} defaultCountry={!isRegional?userCountry:'Chile'}/>}
    {toast&&<div style={{position:'fixed',bottom:22,right:22,background:toast.type==='success'?'#10B981':'#EF4444',color:'white',padding:'11px 18px',borderRadius:10,fontSize:13,fontWeight:600,boxShadow:'0 8px 32px rgba(0,0,0,0.4)',zIndex:9999,animation:'slideIn 0.3s ease'}}>{toast.msg}</div>}
  </div>
}

// ── ROOT ──────────────────────────────────────────────────
function AppContent(){
  const{user,loading}=useAuth()
  if(loading)return <div style={{minHeight:'100vh',background:'#080C12',display:'flex',alignItems:'center',justifyContent:'center'}}>
    <div style={{textAlign:'center',color:'#64748B',fontSize:14}}>
      <div style={{width:44,height:44,background:'linear-gradient(135deg,#10B981,#059669)',borderRadius:12,display:'inline-flex',alignItems:'center',justifyContent:'center',fontSize:20,fontWeight:800,color:'white',marginBottom:16}}>W</div>
      <div>Cargando...</div>
    </div>
  </div>
  return user?<CRMApp/>:<LoginPage/>
}

function App(){return <AuthProvider><AppContent/></AuthProvider>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
</script>
</body>
</html>
